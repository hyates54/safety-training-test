   {h:'Rules for the welder', b:`<ul><li><b>Never let the electrode or holder touch bare skin, or wet clothing over skin.</b> Not your arm, not under your armpit, not draped over your shoulder.</li><li>Dry gloves in good condition, and dry clothing. Change out of soaked leathers.</li><li>Insulate yourself from the work and from ground — dry plywood, rubber mat, dry board. Do not kneel directly on damp steel or concrete to weld.</li><li>Put the holder in an insulated rack or hook when you set it down. Never on the bench, never on the workpiece, never on a cylinder.</li><li><b>Shut off the machine</b> before changing wire, feeding a new electrode into an unfamiliar holder, or leaving the station.</li><li>Do not change polarity or taps under load — turn the machine off first.</li><li>Never coil or drape leads around your body.</li><li>Two machines, two welders, one part: two open circuit voltages can add across you. Coordinate before you both work the same piece.</li></ul>`},
   {h:'Work lead and return path', b:`<p>This is the one that quietly destroys equipment and injures people.</p>
   <ul><li><b>Clamp the work lead directly to the workpiece, as close to the weld as you can get it.</b> Clean, bare metal, tight connection.</li><li><b>Never let welding current find its own way back.</b> Current returning through building steel, a crane, a hoist, a rope, rigging, bearings, a shaft, a machine tool, or piping arcs across every joint and bearing it passes through. It pits bearings, welds wire rope strands, and starts fires inside walls.</li><li><b>The work lead is not a grounding conductor.</b> The equipment grounding conductor protects the machine frame from becoming energized. The work lead is the welding current return path. They are separate things and one does not substitute for the other.</li><li>A poor work clamp connection also gives you bad arc starts and porosity — the electrical problem and the weld problem are the same problem.</li></ul>`},
   {h:'Cables, cords, and machines', b:`<ul><li>Inspect leads, cords, and connections before every use. Look at the whole length, not the ends.</li><li><b>Exposed conductor is out of service.</b> Electrical tape over a damaged spot is not a repair. Splices and repairs use proper insulated connectors and must have insulation equal to the original cable.</li><li>No splice within 10 feet of the electrode holder.</li><li>Keep leads out of walkways, out of standing water, off of hot metal, and clear of grinding.</li><li>Do not use a lead as a sling, a tie-down, or a handle.</li><li><b>GFCI protection</b> on portable tools, extension cords, and temporary power — always on construction sites and in wet or damp locations.</li><li>Extension cords: heavy-duty three-wire, no missing ground pin, no daisy chains, no running through doorways where they get pinched.</li><li>Never remove the ground pin from a plug or use a cheater adapter.</li><li><b>Lock out the machine before opening a case or servicing anything.</b> Capacitors hold a charge after the disconnect is open. Machine repairs are for qualified personnel only.</li><li>Do not stand a welding machine in water or run it in the rain without proper protection.</li><li>Keep the machine clean, ventilated, and clear of stored material.</li></ul>`},
   {h:'If someone gets shocked', b:`<ol><li><b>Do not touch him.</b> Kill the power first — disconnect, breaker, machine switch.</li><li>If you cannot kill it, move him clear with a dry non-conductive object. Never with your hands.</li><li>Call 911. Start CPR if there is no pulse. Use an AED if one is available.</li><li><b>Anybody who takes a shock gets medical evaluation</b> even if he feels fine. Cardiac rhythm problems and internal burns can show up later, and internal injury from current does not match how the entry point looks.</li><li>Report it and secure the equipment for investigation.</li></ol>`},
   {h:'Annual incident review', b:`<p>This is the part where we look at our own year instead of a standard. The foreman covers, with the crew:</p>
   <ul><li>Every recordable injury, first aid case, and near miss from the past twelve months — what happened and what changed because of it.</li><li>Near misses specifically. The near miss is the free lesson and it only stays free if somebody reports it.</li><li>Any incident in the trade — from a customer's plant, an industry alert, a fatality report — worth learning from.</li><li>Changes to shop practice, tooling, or PPE made in the last year, and why.</li><li>Open items the crew has raised: equipment that needs repair, a job that needs a better method, PPE that is not working.</li><li>What we are watching for in the coming year.</li></ul>
   <div class="callout"><b>Reporting is not getting somebody in trouble</b>There is no discipline in this shop for reporting a near miss, an injury, or an unsafe condition, and there is none for stopping a job you believe is unsafe. What gets somebody in trouble is staying quiet and letting the next man find out the hard way.</div>`}
  ],
  quiz:[
   {q:"Where does the work lead belong?",o:["Anywhere on the building steel","Clamped directly to the workpiece near the weld","On the crane hook for convenience","Wherever it reaches"],a:1,
    e:"Directly to the workpiece, close to the weld, on clean bare metal. Letting current return through building steel, a crane, rigging, or bearings arcs across every joint it crosses."},
   {q:"Why does wet clothing raise shock risk?",o:["It lowers body resistance so more current flows","It attracts the arc","It does not matter if voltage is under 100 V","It makes the machine draw more current"],a:0,
    e:"Moisture drops your resistance sharply, so a voltage that felt like a tingle dry can push dangerous current through you wet. Change out of soaked gear."},
   {q:"Where should you set an electrode holder down?",o:["Under your arm while you reposition","In an insulated rack or hook","On the welding machine case","On the workpiece"],a:1,
    e:"Insulated rack or hook. Never on bare skin, under your arm, on the workpiece, or on a cylinder."},
   {q:"A welding lead has exposed conductor mid-span. What is acceptable?",o:["Coil that section up out of the way","Wrap it with electrical tape","Out of service until repaired with proper insulated connectors","Use it if the exposed part stays dry"],a:2,
    e:"Out of service. Repairs use proper insulated connectors with insulation equal to the original cable. Tape is not a repair, and no splice within 10 ft of the holder."},
   {q:"How does the equipment grounding conductor differ from the work lead?",o:["Only DC machines need a ground","They are the same thing","Grounding protects the machine frame from energizing; the work lead is the welding current return","The work lead is the ground"],a:2,
    e:"Two separate systems. The grounding conductor keeps the frame from becoming energized. The work lead carries welding current back. Neither substitutes for the other."}
  ]}
];

const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtMonth(ym){ const [y,m]=ym.split('-'); return MONTH_NAMES[+m-1]+' '+y; }
function fmtDate(iso){ const d=new Date(iso); return (d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear(); }
function nowMonth(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- storage (Firebase Firestore, real-time) ---------- */
const BLANK = { roster:[], records:{}, pin:'1994' };
let DB = JSON.parse(JSON.stringify(BLANK));
let STORAGE_OK = false;

async function readRaw(){
  if(!fbReady) return null;
  try{
    const snap = await DOC_REF().get();
    return snap.exists ? snap.data() : null;
  }catch(e){ console.error('Firestore read failed', e); return null; }
}
async function writeRaw(obj){
  if(!fbReady) return false;
  try{ await DOC_REF().set(obj); return true; }
  catch(e){ console.error('Firestore write failed', e); return false; }
}
async function loadDB(){
  if(!fbReady) return;
  STORAGE_OK = true;
  const d = await readRaw();
  if(d){ DB = Object.assign(JSON.parse(JSON.stringify(BLANK)), d); }
  else { await writeRaw(DB); }

  /* Live sync: any device's change updates every open screen automatically. */
  DOC_REF().onSnapshot(snap=>{
    if(!snap.exists) return;
    DB = Object.assign(JSON.parse(JSON.stringify(BLANK)), snap.data());
    render();
  }, err=>{ console.error('Firestore listener error', err); });
}
/* read-modify-write so two phones don't clobber each other */
async function commit(mutate){
  let base = STORAGE_OK ? (await readRaw()) : null;
  if(!base) base = DB;
  base = Object.assign(JSON.parse(JSON.stringify(BLANK)), base);
  mutate(base);
  DB = base;
  if(STORAGE_OK) await writeRaw(base);
}

/* ---------- record helpers ---------- */
const rkey = (empId, modId) => empId+'::'+modId;
function getRec(empId, modId){ return DB.records[rkey(empId,modId)] || null; }
function applies(emp, mod){ return mod.scope==='all' || (emp.role||'both')!=='shop'; }

function statusOf(emp, mod){
  if(!applies(emp,mod)) return 'na';
  if(getRec(emp.id, mod.id)) return 'done';
  const cm = nowMonth();
  if(mod.month > cm) return 'locked';
  if(mod.month === cm) return 'due';
  return 'overdue';
}
function currentModule(){
  const cm = nowMonth();
  return MODULES.find(m=>m.month===cm) || null;
}

/* ---------- app state ---------- */
let S = { view:'signin', empId:null, modId:null, step:0, answers:[], graded:null, tab:'status', supAuthed:false };
const app = document.getElementById('app');

function emp(){ return DB.roster.find(e=>e.id===S.empId) || null; }
function mod(){ return MODULES.find(m=>m.id===S.modId) || null; }

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}
function setMast(){
  document.getElementById('mastMonth').textContent = fmtMonth(nowMonth());
  const e = emp();
  document.getElementById('mastWho').textContent =
    S.view==='sup' ? 'Supervisor' : (e ? e.name : 'Not signed in');
}

/* ============================ RENDER ============================ */
function render(){
  setMast();
  const v = S.view;
  if(v==='signin')  app.innerHTML = viewSignin();
  if(v==='home')    app.innerHTML = viewHome();
  if(v==='read')    app.innerHTML = viewRead();
  if(v==='quiz')    app.innerHTML = viewQuiz();
  if(v==='result')  app.innerHTML = viewResult();
  if(v==='supPin')  app.innerHTML = viewSupPin();
  if(v==='sup')     app.innerHTML = viewSup();
  window.scrollTo(0,0);
  wire();
}

/* ---- sign in ---- */
function viewSignin(){
  const cm = currentModule();
  let h = '';
  if(cm){
    h += `<div class="hero">
      <div class="eyebrow">This month · ${fmtMonth(cm.month)}</div>
      <h2>${esc(cm.title)}</h2>
      <div class="refs">${esc(cm.refs)}</div>
      <div style="font-size:15px;color:#CFDDD4;max-width:52ch">Pick your name below to read the module and take the quiz. Takes about ten minutes.</div>
    </div>`;
  }
  h += `<div class="hr"></div><div class="eyebrow">Sign in</div>`;
  if(!DB.roster.length){
    h += `<div class="cardbox"><h2>No crew on the roster yet</h2>
      <p class="sub">A supervisor needs to add names before anyone can log training.</p>
      <button class="btn" data-go="supPin">Open supervisor tools</button></div>`;
    return h;
  }
  h += `<div class="grid-names">`;
  DB.roster.filter(e=>e.active!==false).forEach(e=>{
    const open = MODULES.filter(m=>['due','overdue'].includes(statusOf(e,m))).length;
    const flag = open>0 ? `<span class="flag">${open} outstanding</span>` : 'All current';
    h += `<button class="namebtn" data-emp="${e.id}">${esc(e.name)}<small>${flag}</small></button>`;
  });
  h += `</div><div class="hr"></div>
    <button class="linkish" data-go="supPin">Supervisor tools</button>`;
  if(!STORAGE_OK) h += `<div class="warnbox" style="margin-top:18px"><b>Records not saving</b>The database is not connected, so anything logged now will be lost when the page closes. See Settings for setup.</div>`;
  return h;
}

/* ---- employee home ---- */
function viewHome(){
  const e = emp(); const cm = currentModule();
  let h = '';
  if(cm && applies(e,cm)){
    const rec = getRec(e.id, cm.id);
    h += `<div class="hero">
      <div class="eyebrow">Your module this month · ${fmtMonth(cm.month)}</div>
      <h2>${esc(cm.title)}</h2>
      <div class="refs">${esc(cm.refs)}</div>`;
    if(rec){
      h += `<div class="done-note">Completed ${fmtDate(rec.date)} · score ${rec.score}%${rec.method==='inperson'?' · in-person session':''}</div>
        <div style="margin-top:14px"><button class="btn ghost" data-mod="${cm.id}">Review it again</button></div>`;
    } else {
      h += `<button class="btn" data-mod="${cm.id}">Start module</button>`;
    }
    h += `</div>`;
  }
  const open = MODULES.filter(m=>statusOf(e,m)==='overdue');
  if(open.length){
    h += `<div class="warnbox" style="margin-top:18px"><b>Past due</b>You have ${open.length} module${open.length>1?'s':''} from earlier months still outstanding. Work through them when you get a chance.</div>`;
  }
  h += `<div class="hr"></div><div class="eyebrow">Your training year</div>`;
  MODULES.forEach((m,i)=>{
    const st = statusOf(e,m);
    if(st==='na') return;
    const rec = getRec(e.id,m.id);
    const pillTxt = {done:'Complete',due:'Due now',overdue:'Past due',locked:'Scheduled'}[st];
    const tagOpen = st==='locked' ? `<div class="tag state-locked">` : `<button class="tag state-${st}" data-mod="${m.id}">`;
    const tagClose = st==='locked' ? `</div>` : `</button>`;
    h += tagOpen +
      `<div class="tag-code">${m.id} · ${fmtMonth(m.month)} · ${esc(m.cycle)}</div>
       <div class="tag-title">${esc(m.title)}</div>
       <div class="tag-meta">${esc(m.refs)}</div>
       <div style="margin-top:9px"><span class="pill ${st}">${pillTxt}</span>
       ${rec?`<span class="tag-meta" style="margin-left:8px">${fmtDate(rec.date)} · ${rec.score}%</span>`:''}</div>` +
      tagClose;
  });
  h += `<div class="hr"></div><button class="linkish" data-go="signin">Sign out</button>`;
  return h;
}

/* ---- reader ---- */
function viewRead(){
  const m = mod(), e = emp();
  const sec = m.sections[S.step];
  const last = S.step === m.sections.length-1;
  let bar = '<div class="stepbar">' + m.sections.map((_,i)=>`<i class="${i<=S.step?'on':''}"></i>`).join('') + '</div>';
  return `<div class="eyebrow">${m.id} · ${fmtMonth(m.month)} · ${esc(m.refs)}</div>
    <h2>${esc(m.title)}</h2>
    <p class="sub">${esc(e.name)} · ${esc(m.cycle)}</p>
    ${bar}
    <div class="reader">
      <div class="stepnum">Section ${S.step+1} of ${m.sections.length}</div>
      <h2 style="font-size:22px;margin-bottom:12px">${esc(sec.h)}</h2>
      ${sec.b}
    </div>
    <div class="navrow">
      <button class="btn ghost sm" data-nav="back">${S.step===0?'Leave module':'Previous'}</button>
      ${last ? `<button class="btn" data-nav="quiz">Go to the quiz</button>`
             : `<button class="btn" data-nav="next">Next section</button>`}
    </div>`;
}

/* ---- quiz ---- */
function shuffleQuiz(){
  const m = mod();
  S.order = m.quiz.map(q=>{
    const idx = q.o.map((_,j)=>j);
    for(let i=idx.length-1;i>0;i--){
      const r = Math.floor(Math.random()*(i+1));
      [idx[i],idx[r]] = [idx[r],idx[i]];
    }
    return idx;
  });
}
function viewQuiz(){
  const m = mod();
  if(!S.order || S.order.length!==m.quiz.length) shuffleQuiz();
  let h = `<div class="eyebrow">${m.id} · Quiz · ${PASS_PCT}% to pass</div>
    <h2>${esc(m.title)}</h2>
    <p class="sub">Answer all ${m.quiz.length} questions, then submit. You can retake it if you come up short.</p>`;
  m.quiz.forEach((q,i)=>{
    h += `<div class="q"><div class="qn">Question ${i+1} of ${m.quiz.length}</div>
      <div class="qt">${esc(q.q)}</div>`;
    S.order[i].forEach(j=>{
      h += `<label class="opt"><input type="radio" name="q${i}" value="${j}" ${S.answers[i]===j?'checked':''}><span>${esc(q.o[j])}</span></label>`;
    });
    h += `</div>`;
  });
  h += `<div class="navrow">
      <button class="btn ghost sm" data-nav="reread">Back to the reading</button>
      <button class="btn" id="submitQuiz">Submit answers</button>
    </div>`;
  return h;
}

/* ---- result ---- */
function viewResult(){
  const m = mod(), e = emp(), g = S.graded;
  const pass = g.pct >= PASS_PCT;
  let h = `<div class="result ${pass?'pass':'fail'}">
    <div class="score">${g.pct}%</div>
    <div class="verdict">${pass?'Passed':'Not yet'}</div>
    <div class="rmeta">${g.right} of ${m.quiz.length} correct · ${PASS_PCT}% required${pass?` · logged ${fmtDate(new Date().toISOString())}`:''}</div>
  </div>`;
  h += pass
    ? `<p>Logged for ${esc(e.name)} — ${esc(m.title)}. Review anything you missed below.</p>`
    : `<div class="warnbox"><b>Retake required</b>Go back through the sections you missed and take the quiz again. Nothing is logged until you pass.</div>`;
  m.quiz.forEach((q,i)=>{
    const chose = S.answers[i], ok = chose===q.a;
    h += `<div class="q ${ok?'flag-right':'flag-wrong'}"><div class="qn">Question ${i+1} · ${ok?'Correct':'Missed'}</div>
      <div class="qt">${esc(q.q)}</div>`;
    (S.order&&S.order[i] ? S.order[i] : q.o.map((_,j)=>j)).forEach(j=>{
      let cls = 'opt';
      if(j===q.a) cls += ' correct';
      else if(j===chose) cls += ' chosen-wrong';
      h += `<div class="${cls}"><span style="font-family:var(--mono);font-size:12px;min-width:14px">${j===q.a?'\u2713':(j===chose?'\u2717':'')}</span><span>${esc(q.o[j])}</span></div>`;
    });
    h += `<div class="why"><b>Why:</b> ${esc(q.e)}</div></div>`;
  });
  h += `<div class="navrow">
    <button class="btn ghost sm" data-nav="reread">Reread the module</button>
    ${pass?`<button class="btn" data-go="home">Back to my modules</button>`
           :`<button class="btn" data-nav="retake">Retake the quiz</button>`}
  </div>`;
  return h;
}

/* ---- supervisor ---- */
function viewSupPin(){
  return `<div class="cardbox" style="max-width:420px">
    <div class="eyebrow">Restricted</div>
    <h2>Supervisor tools</h2>
    <p class="sub">Roster, completion records, and export.</p>
    <label class="fld" for="pin">PIN</label>
    <input type="password" id="pin" inputmode="numeric" autocomplete="off">
    <div class="navrow"><button class="btn ghost sm" data-go="signin">Cancel</button>
      <button class="btn" id="pinGo">Open</button></div>
  </div>`;
}

function viewSup(){
  const t = S.tab;
  let h = `<div class="tabs">
    ${['status','roster','records','modules','settings'].map(k=>`<button data-tab="${k}" class="${t===k?'on':''}">${{status:'Status',roster:'Crew',records:'Records',modules:'Modules',settings:'Settings'}[k]}</button>`).join('')}
  </div>`;
  if(t==='status')   h += supStatus();
  if(t==='roster')   h += supRoster();
  if(t==='records')  h += supRecords();
  if(t==='modules')  h += supModules();
  if(t==='settings') h += supSettings();
  h += `<div class="hr"></div><button class="linkish" data-go="signin">Close supervisor tools</button>`;
  return h;
}

function supStatus(){
  const active = DB.roster.filter(e=>e.active!==false);
  const cm = currentModule();
  let curDone=0, curTotal=0, overdue=0;
  active.forEach(e=>{
    MODULES.forEach(m=>{
      const st = statusOf(e,m);
      if(st==='overdue') overdue++;
      if(cm && m.id===cm.id && st!=='na'){ curTotal++; if(st==='done') curDone++; }
    });
  });
  let h = `<div class="kpis">
    <div class="kpi"><b>${active.length}</b><span>On the crew</span></div>
    <div class="kpi ok"><b>${curDone}/${curTotal}</b><span>${cm?esc(cm.title.split(' ')[0])+' this month':'This month'}</span></div>
    <div class="kpi ${overdue?'warn':''}"><b>${overdue}</b><span>Past due total</span></div>
  </div>`;
  if(cm) h += `<p class="sub" style="margin-top:-8px">Current module: <b>${esc(cm.title)}</b> — ${fmtMonth(cm.month)}</p>`;
  if(!active.length) return h + `<div class="cardbox"><h2>Add your crew first</h2><p class="sub">Go to the Crew tab to add names.</p></div>`;

  h += `<div class="matrix-scroll"><table><thead><tr><th>Name</th>`;
  MODULES.forEach(m=>{ h += `<th title="${esc(m.title)}">${m.month.slice(5)}/${m.month.slice(2,4)}</th>`; });
  h += `</tr></thead><tbody>`;
  active.forEach(e=>{
    h += `<tr><td class="nm">${esc(e.name)}</td>`;
    MODULES.forEach(m=>{
      const st = statusOf(e,m);
      const ch = {done:'\u2713',due:'!',overdue:'\u00D7',locked:'\u00B7',na:'\u2013'}[st];
      const rec = getRec(e.id,m.id);
      const ttl = `${e.name} — ${m.title}${rec?` — ${fmtDate(rec.date)}, ${rec.score}%`:''}`;
      h += `<td><span class="cell ${st}" title="${esc(ttl)}">${ch}</span></td>`;
    });
    h += `</tr>`;
  });
  h += `</tbody></table></div>
  <div class="legend">
    <span><i class="swatch" style="border-color:var(--lens-2);background:#D8E6DE"></i>Complete</span>
    <span><i class="swatch" style="border-color:var(--straw);background:var(--straw-lt)"></i>Due this month</span>
    <span><i class="swatch" style="border-color:var(--cherry);background:var(--cherry-lt)"></i>Past due</span>
    <span><i class="swatch" style="border-color:var(--hair);background:var(--zinc-dk)"></i>Scheduled</span>
    <span><i class="swatch" style="border-color:transparent"></i>Not assigned</span>
  </div>`;
  return h;
}

  let h = `<div class="cardbox">
    <div class="eyebrow">Add someone</div>
    <div class="row2">
      <div><label class="fld" for="newName">Name</label><input type="text" id="newName" placeholder="First and last"></div>
      <div><label class="fld" for="newRole">Assignment</label>
        <select id="newRole">
          <option value="both">Shop and field</option>
          <option value="field">Field</option>
          <option value="shop">Shop only</option>
        </select></div>
      <div style="flex:0 0 auto"><button class="btn" id="addEmp">Add to crew</button></div>
    </div>
    <p class="sub" style="margin:12px 0 0">Shop-only skips fall protection and steel erection. Everything else applies to everybody.</p>
  </div>`;
  if(!DB.roster.length) return h;
  h += `<div class="cardbox"><div class="eyebrow">Crew</div>`;
  DB.roster.forEach(e=>{
    const done = MODULES.filter(m=>statusOf(e,m)==='done').length;
    const total = MODULES.filter(m=>applies(e,m)).length;
    h += `<div class="rosterrow">
      <div class="who">${esc(e.name)}${e.active===false?' <span class="pill locked">Inactive</span>':''}
        <div class="tag-meta">${done} of ${total} complete · ${({both:'Shop and field',field:'Field',shop:'Shop only'})[e.role||'both']}</div></div>
      <select data-role="${e.id}" style="width:auto;flex:0 0 auto">
        <option value="both" ${(e.role||'both')==='both'?'selected':''}>Shop and field</option>
        <option value="field" ${e.role==='field'?'selected':''}>Field</option>
        <option value="shop" ${e.role==='shop'?'selected':''}>Shop only</option>
      </select>
      <button class="btn ghost sm" data-toggle="${e.id}">${e.active===false?'Reactivate':'Set inactive'}</button>
      <button class="btn ghost sm" data-del="${e.id}">Remove</button>
    </div>`;

  h += `</div>`;
  return h;

function supModules(){
  const cm = nowMonth();
  let h = `<div class="cardbox">
    <div class="eyebrow">Module library</div>
    <p class="sub" style="margin:0">All twelve, readable and printable no matter what month it is. Open one to read exactly what the crew sees, or print a handout, a paper quiz, or the answer key for a classroom session.</p>
  </div>`;
  MODULES.forEach(m=>{
    const open = S.openMod===m.id;
    const words = m.sections.reduce((n,s)=>n + s.b.replace(/<[^>]+>/g,' ').split(/\s+/).filter(Boolean).length, 0);
    const when = m.month===cm ? '<span class="pill due">Current month</span>'
               : m.month<cm  ? '<span class="pill overdue">Past</span>'
                             : '<span class="pill locked">Upcoming</span>';
    h += `<div class="cardbox" style="padding:0;overflow:hidden">
      <div style="padding:18px 20px">
        <div class="tag-code">${m.id} · ${fmtMonth(m.month)} · ${esc(m.cycle)}${m.scope==='field'?' · Field crew only':''}</div>
        <div class="tag-title" style="font-family:var(--disp);font-weight:700;font-size:21px;line-height:1.02;text-transform:uppercase;letter-spacing:.02em;margin:3px 0 5px">${esc(m.title)}</div>
        <div class="tag-meta">${esc(m.refs)}</div>
        <div style="margin:10px 0 14px">${when}
          <span class="tag-meta" style="margin-left:8px">${m.sections.length} sections · ${m.quiz.length} questions · about ${Math.round(words/180)} min read</span></div>
        <div class="row2">
          <div style="flex:0 0 auto"><button class="btn sm ${open?'ghost':''}" data-openmod="${m.id}">${open?'Collapse':'Read it'}</button></div>
          <div style="flex:0 0 auto"><button class="btn ghost sm" data-print="handout:${m.id}">Print handout</button></div>
          <div style="flex:0 0 auto"><button class="btn ghost sm" data-print="quiz:${m.id}">Print quiz</button></div>
          <div style="flex:0 0 auto"><button class="btn ghost sm" data-print="key:${m.id}">Print answer key</button></div>
          <div style="flex:0 0 auto"><button class="btn ghost sm" data-print="signin:${m.id}">Print sign-in sheet</button></div>
        </div>
      </div>`;
    if(open){
      h += `<div style="border-top:1.5px solid var(--ink);background:var(--zinc);padding:20px">`;
      m.sections.forEach((s,i)=>{
        h += `<div class="reader" style="margin-bottom:12px">
          <div class="stepnum">Section ${i+1} of ${m.sections.length}</div>
          <h2 style="font-size:20px;margin-bottom:12px">${esc(s.h)}</h2>
          ${s.b}
        </div>`;
      });
      h += `<div class="eyebrow" style="margin-top:22px">Quiz · ${PASS_PCT}% to pass · answers shown</div>`;
      m.quiz.forEach((q,i)=>{
        h += `<div class="q flag-right"><div class="qn">Question ${i+1}</div><div class="qt">${esc(q.q)}</div>`;
        q.o.forEach((o,j)=>{
          h += `<div class="opt${j===q.a?' correct':''}"><span style="font-family:var(--mono);font-size:12px;min-width:14px">${j===q.a?'\u2713':''}</span><span>${esc(o)}</span></div>`;
        });
        h += `<div class="why"><b>Why:</b> ${esc(q.e)}</div></div>`;
      });
      h += `<button class="btn ghost sm" data-openmod="${m.id}">Collapse</button></div>`;
    }
    h += `</div>`;
  });
  return h;
}

function supRecords(){
  const active = DB.roster.filter(e=>e.active!==false);
  let h = `<div class="cardbox">
    <div class="eyebrow">Log an in-person session</div>
    <p class="sub" style="margin-bottom:14px">For toolbox talks and classroom sessions already delivered. Recorded at 100% and marked as an in-person session.</p>
    <div class="row2">
      <div><label class="fld" for="logEmp">Who</label><select id="logEmp">
        <option value="__all">Everybody on the crew</option>
        ${active.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}
      </select></div>
      <div><label class="fld" for="logMod">Module</label><select id="logMod">
        ${MODULES.map(m=>`<option value="${m.id}">${m.id} — ${esc(m.title)}</option>`).join('')}
      </select></div>
      <div><label class="fld" for="logDate">Date delivered</label><input type="text" id="logDate" placeholder="MM/DD/YYYY"></div>
      <div style="flex:0 0 auto"><button class="btn" id="logGo">Record it</button></div>
    </div>
  </div>`;

  const rows = Object.values(DB.records).sort((a,b)=> b.date.localeCompare(a.date));
  h += `<div class="cardbox">
    <div class="eyebrow">Completion records · ${rows.length}</div>
    <div class="row2" style="margin-bottom:14px">
      <div style="flex:0 0 auto"><button class="btn sm" id="exportCsv">Download CSV</button></div>
      <div style="flex:0 0 auto"><button class="btn ghost sm" id="printSheet">Print sign-in sheet</button></div>
    </div>`;
  if(!rows.length){ h += `<p class="sub" style="margin:0">Nothing logged yet. Records appear here as the crew completes modules.</p></div>`; return h; }
  h += `<div class="matrix-scroll"><table><thead><tr>
    <th>Date</th><th>Name</th><th>Module</th><th>Score</th><th>Method</th><th>Standard</th><th></th></tr></thead><tbody>`;
  rows.forEach(r=>{
    const e = DB.roster.find(x=>x.id===r.empId);
    const m = MODULES.find(x=>x.id===r.modId);
    if(!e||!m) return;
    h += `<tr><td>${fmtDate(r.date)}</td><td class="nm">${esc(e.name)}</td><td>${esc(m.title)}</td>
      <td>${r.score}%</td><td>${r.method==='inperson'?'In person':'Online quiz'}</td><td>${esc(m.refs)}</td>
      <td><button class="linkish" data-rmrec="${rkey(r.empId,r.modId)}" style="font-size:12px">Delete</button></td></tr>`;
  });
  h += `</tbody></table></div></div>`;
  return h;
}

/* ============================ EVENTS ============================ */
function wire(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    const g=b.dataset.go;
    if(g==='signin'){ S={...S, view:'signin', empId:null, supAuthed:false}; }
    else if(g==='supPin'){ S.view = S.supAuthed?'sup':'supPin'; }
    else S.view=g;
    render();
  });
  document.querySelectorAll('[data-emp]').forEach(b=>b.onclick=()=>{
    S.empId=b.dataset.emp; S.view='home'; render();
  });
  document.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{
    S.modId=b.dataset.mod; S.step=0; S.answers=[]; S.graded=null; S.order=null; S.view='read'; render();
  });
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    const n=b.dataset.nav, m=mod();
    if(n==='next'){ S.step=Math.min(S.step+1,m.sections.length-1); }
    if(n==='back'){ if(S.step===0){ S.view='home'; } else S.step--; }
    if(n==='quiz'){ S.view='quiz'; }
    if(n==='reread'){ S.step=0; S.view='read'; }
    if(n==='retake'){ S.answers=[]; S.graded=null; S.order=null; S.view='quiz'; }
    render();
  });
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); });

  const sq = document.getElementById('submitQuiz');
  if(sq) sq.onclick = submitQuiz;

  const pinGo = document.getElementById('pinGo');
  if(pinGo){
    const go = ()=>{
      const v=document.getElementById('pin').value.trim();
      if(v===String(DB.pin)){ S.supAuthed=true; S.view='sup'; render(); }
      else toast('That PIN is not right.');
    };
    pinGo.onclick=go;
    document.getElementById('pin').onkeydown=e=>{ if(e.key==='Enter') go(); };
  }

  const addEmp = document.getElementById('addEmp');
  if(addEmp) addEmp.onclick = async ()=>{
    const name=document.getElementById('newName').value.trim();
    const role=document.getElementById('newRole').value;
    if(!name){ toast('Enter a name first.'); return; }
    const id='e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    await commit(d=>{ d.roster.push({id,name,role,active:true}); });
    toast(name+' added to the crew.'); render();
  };
  document.querySelectorAll('[data-role]').forEach(sel=>sel.onchange=async ()=>{
    const id=sel.dataset.role, v=sel.value;
    await commit(d=>{ const e=d.roster.find(x=>x.id===id); if(e) e.role=v; });
    render();
  });
  document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async ()=>{
    const id=b.dataset.toggle;
    await commit(d=>{ const e=d.roster.find(x=>x.id===id); if(e) e.active = e.active===false; });
    render();
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async ()=>{
    const id=b.dataset.del;
    const e=DB.roster.find(x=>x.id===id);
    if(!confirm('Remove '+(e?e.name:'this person')+' and all of their training records? Export a CSV first if you need the history.')) return;
    await commit(d=>{
      d.roster = d.roster.filter(x=>x.id!==id);
      Object.keys(d.records).forEach(k=>{ if(k.startsWith(id+'::')) delete d.records[k]; });
    });
    toast('Removed.'); render();
  });
  document.querySelectorAll('[data-rmrec]').forEach(b=>b.onclick=async ()=>{
    const k=b.dataset.rmrec;
    if(!confirm('Delete this completion record?')) return;
    await commit(d=>{ delete d.records[k]; });
    toast('Record deleted.'); render();
  });

  const logGo = document.getElementById('logGo');
  if(logGo) logGo.onclick = async ()=>{
    const who=document.getElementById('logEmp').value;
    const modId=document.getElementById('logMod').value;
    const dv=document.getElementById('logDate').value.trim();
    let iso=new Date().toISOString();
    if(dv){
      const p=dv.split(/[\/\-]/);
      if(p.length===3){
        const d=new Date(+p[2], +p[0]-1, +p[1]);
        if(!isNaN(d)) iso=d.toISOString(); else { toast('Use MM/DD/YYYY for the date.'); return; }
      } else { toast('Use MM/DD/YYYY for the date.'); return; }
    }
    const targets = who==='__all' ? DB.roster.filter(e=>e.active!==false) : DB.roster.filter(e=>e.id===who);
    const m = MODULES.find(x=>x.id===modId);
    const use = targets.filter(e=>applies(e,m));
    if(!use.length){ toast('That module does not apply to who you picked.'); return; }
    await commit(d=>{
      use.forEach(e=>{ d.records[rkey(e.id,modId)] = {empId:e.id, modId, date:iso, score:100, method:'inperson'}; });
    });
    toast('Logged for '+use.length+(use.length>1?' people.':' person.')); render();
  };

  const ex = document.getElementById('exportCsv');
  if(ex) ex.onclick = exportCsv;
  const pr = document.getElementById('printSheet');
  if(pr) pr.onclick = ()=>printDoc('signin', (currentModule()||MODULES[0]).id);

  document.querySelectorAll('[data-openmod]').forEach(b=>b.onclick=()=>{
    S.openMod = S.openMod===b.dataset.openmod ? null : b.dataset.openmod;
    render();
  });
  document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>{
    const [kind,id] = b.dataset.print.split(':');
    printDoc(kind, id);
  });

  const pinSave = document.getElementById('pinSave');
  if(pinSave) pinSave.onclick = async ()=>{
    const v=document.getElementById('pinNew').value.trim();
    if(v.length<4){ toast('Use at least four digits.'); return; }
    await commit(d=>{ d.pin=v; });
    toast('PIN saved.'); document.getElementById('pinNew').value='';
  };
  const wipe = document.getElementById('wipe');
  if(wipe) wipe.onclick = async ()=>{
    if(!confirm('Delete every completion record for everyone? This cannot be undone.')) return;
    await commit(d=>{ d.records={}; });
    toast('All records cleared.'); render();
  };

  document.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=()=>{
    const i=+r.name.slice(1); S.answers[i]=+r.value;
  });
}

async function submitQuiz(){
  const m=mod(), e=emp();
  if(S.answers.filter(a=>a!==undefined && a!==null).length < m.quiz.length){
    toast('Answer all '+m.quiz.length+' questions before submitting.'); return;
  }
  let right=0;
  m.quiz.forEach((q,i)=>{ if(S.answers[i]===q.a) right++; });
  const pct = Math.round(right/m.quiz.length*100);
  S.graded = {right, pct};
  if(pct >= PASS_PCT){
    await commit(d=>{
      d.records[rkey(e.id,m.id)] = {empId:e.id, modId:m.id, date:new Date().toISOString(), score:pct, method:'quiz'};
    });
  }
  S.view='result'; render();
}

function exportCsv(){
  const rows=[['Date','Employee','Assignment','Module ID','Module','Due Month','Standard','Score %','Method']];
  Object.values(DB.records).sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>{
    const e=DB.roster.find(x=>x.id===r.empId), m=MODULES.find(x=>x.id===r.modId);
    if(!e||!m) return;
    rows.push([fmtDate(r.date), e.name, ({both:'Shop and field',field:'Field',shop:'Shop only'})[e.role||'both'],
      m.id, m.title, fmtMonth(m.month), m.refs, r.score, r.method==='inperson'?'In-person session':'Online quiz']);
  });
  const csv = rows.map(r=>r.map(c=>{
    const s=String(c); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');
  a.href=url; a.download='WWS-safety-training-records-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('CSV downloaded.');
}

function printHeader(m, subtitle){
  return `<h1 style="margin:0 0 2px;font-size:19pt">Wilson Welding Service</h1>
    <div style="font-size:11pt;margin-bottom:4px">Safety Training — ${esc(subtitle)}</div>
    <div style="border-bottom:2px solid #000;margin-bottom:14px"></div>
    <div style="font-size:11pt;line-height:1.5;margin-bottom:18px">
      <b>Module ${esc(m.id)} — ${esc(m.title)}</b><br>
      Standard: ${esc(m.refs)}<br>
      Scheduled: ${fmtMonth(m.month)} &nbsp;·&nbsp; Cycle: ${esc(m.cycle)}${m.scope==='field'?' &nbsp;·&nbsp; Field crew only':''}
    </div>`;
}

function printDoc(kind, modId){
  const m = MODULES.find(x=>x.id===modId) || currentModule() || MODULES[0];
  const area = document.getElementById('printArea');
  let h = `<div class="pdoc">`;

  if(kind==='handout'){
    h += printHeader(m,'Participant Handout');
    m.sections.forEach((s,i)=>{
      h += `<h2 style="font-size:13pt;margin:20px 0 6px;border-bottom:1px solid #999;padding-bottom:3px">
        ${i+1}. ${esc(s.h)}</h2>${s.b}`;
    });
    h += `<div style="border-top:2px solid #000;margin-top:26px;padding-top:10px;font-size:9.5pt">
      Reviewed with: ______________________________ &nbsp;&nbsp; Date: ____________ &nbsp;&nbsp; Instructor: ____________________</div>`;
  }

  if(kind==='quiz'){
    h += printHeader(m,'Quiz');
    h += `<div style="font-size:11pt;margin-bottom:16px">
      Name: ______________________________________ &nbsp;&nbsp; Date: ______________<br>
      <span style="font-size:10pt">Circle one answer per question. ${PASS_PCT}% required to pass — ${Math.ceil(m.quiz.length*PASS_PCT/100)} of ${m.quiz.length} correct.</span></div>`;
    m.quiz.forEach((q,i)=>{
      h += `<div style="margin-bottom:18px;page-break-inside:avoid">
        <div style="font-weight:bold;font-size:11pt;margin-bottom:6px">${i+1}. ${esc(q.q)}</div>`;
      q.o.forEach((o,j)=>{
        h += `<div style="margin:0 0 4px 22px;font-size:11pt">${'ABCD'[j]}. &nbsp;${esc(o)}</div>`;
      });
      h += `</div>`;
    });
    h += `<div style="border-top:2px solid #000;margin-top:22px;padding-top:10px;font-size:9.5pt">
      Score: _______ / ${m.quiz.length} &nbsp;( _______ % ) &nbsp;&nbsp; Pass / Fail &nbsp;&nbsp; Graded by: ____________________
      <p style="margin-top:12px">By signing I confirm I received this training, that it was presented in a language and vocabulary I understand, and that I had the opportunity to ask questions.</p>
      <p style="margin-top:14px">Signature: ______________________________________ &nbsp;&nbsp; Date: ______________</p></div>`;
  }

  if(kind==='key'){
    h += printHeader(m,'Answer Key — Instructor Copy');
    m.quiz.forEach((q,i)=>{
      h += `<div style="margin-bottom:16px;page-break-inside:avoid">
        <div style="font-weight:bold;font-size:11pt">${i+1}. ${esc(q.q)}</div>
        <div style="margin:4px 0 4px 22px;font-size:11pt">
          <b>Answer: ${'ABCD'[q.a]} — ${esc(q.o[q.a])}</b></div>
        <div style="margin-left:22px;font-size:10pt;color:#333">${esc(q.e)}</div>
      </div>`;
    });
    h += `<div style="border-top:2px solid #000;margin-top:20px;padding-top:10px;font-size:9.5pt">
      Passing score: ${Math.ceil(m.quiz.length*PASS_PCT/100)} of ${m.quiz.length} (${PASS_PCT}%). Do not distribute this page with the quiz.</div>`;
  }

  if(kind==='signin'){
    const active = DB.roster.filter(e=>e.active!==false).filter(e=>applies(e,m));
    const rows = active.map(e=>`<tr><td style="width:34%">${esc(e.name)}</td><td class="sig"></td><td style="width:14%"></td></tr>`).join('')
      + '<tr><td class="sig"></td><td class="sig"></td><td></td></tr>'.repeat(active.length?3:8);
    h += printHeader(m,'Attendance Record');
    h += `<div style="font-size:11pt;margin-bottom:14px">
      Date delivered: ______________________ &nbsp;&nbsp; Instructor: ______________________________</div>
      <table><thead><tr><th>Printed name</th><th>Signature</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>
      <p style="font-size:9.5pt;margin-top:14px">By signing above I confirm I attended this training session, that the material was presented in a language and vocabulary I understand, and that I had the opportunity to ask questions.</p>
      <p style="font-size:9.5pt;margin-top:20px">Instructor signature: ______________________________________ &nbsp;&nbsp; Date: ______________</p>`;
  }

  h += `</div>`;
  area.innerHTML = h;
  window.print();
}

/* ---------- boot ---------- */
(async function(){
  await loadDB();
  render();
})();

/* ---------- PWA install support ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(e=>console.error('SW register failed', e));
  });
}
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
});

</script>
