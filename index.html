<style>

  --zinc:#D7DBD3;
  --zinc-dk:#C3C8BF;
  --plate:#EEF0EA;
  --ink:#161B15;
  --slag:#6E756B;
  --hair:#B6BCB1;
  --lens:#16352A;
  --lens-2:#2A5943;
  --straw:#C08E1C;
  --straw-lt:#F0DCA6;
  --cherry:#A4321C;
  --cherry-lt:#EFD3CB;
  --temper:#2B4C7E;
  --disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--zinc);
  color:var(--ink);
  font-family:var(--body);

}
.wrap{max-width:940px;margin:0 auto;padding:0 18px 72px}

/* ---------- masthead ---------- */
.mast{
  border-bottom:2px solid var(--ink);
  padding:20px 0 12px;
  margin-bottom:26px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.mast h1{
  font-family:var(--disp);
  font-weight:800;
  font-size:clamp(30px,7vw,46px);
  line-height:.92;
  letter-spacing:.01em;
  text-transform:uppercase;
  margin:0;
}
.mast h1 span{display:block;font-size:.42em;font-weight:600;letter-spacing:.22em;color:var(--lens);margin-top:6px}
.mast-right{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--slag);text-align:right}
.mast-right b{display:block;color:var(--ink);font-weight:600;font-size:12px}

/* ---------- generic ---------- */
h2{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:26px;margin:0 0 4px}
h3{font-family:var(--body);font-weight:600;font-size:16px;margin:22px 0 6px}
p{margin:0 0 12px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--slag);margin-bottom:8px}
.sub{color:var(--slag);font-size:14px;margin:0 0 22px}
.hr{height:1px;background:var(--hair);border:0;margin:26px 0}

button{font-family:var(--body);cursor:pointer}
.btn{
  display:inline-block;border:1.5px solid var(--ink);background:var(--ink);color:var(--plate);
  font-weight:600;font-size:15px;padding:13px 22px;border-radius:2px;letter-spacing:.01em;
  min-height:48px;
}
.btn:hover{background:var(--lens);border-color:var(--lens)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--plate)}
.btn.sm{font-size:13px;padding:9px 14px;min-height:40px}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn:disabled:hover{background:var(--ink);border-color:var(--ink)}
.linkish{background:none;border:0;padding:0;color:var(--lens);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--temper);outline-offset:2px}

input[type=text],input[type=password],select{
  font-family:var(--body);font-size:15px;padding:11px 12px;border:1.5px solid var(--hair);
  background:var(--plate);color:var(--ink);border-radius:2px;min-height:46px;width:100%;
}
input:focus,select:focus{border-color:var(--lens)}

/* ---------- the shop tag (signature) ---------- */
.tag{
  position:relative;background:var(--plate);border:1.5px solid var(--ink);border-radius:2px;
  padding:18px 20px 18px 54px;margin-bottom:12px;text-align:left;width:100%;display:block;
}
.tag::before{ /* punch hole */
  content:'';position:absolute;left:20px;top:22px;width:14px;height:14px;border-radius:50%;
  background:var(--zinc);border:1.5px solid var(--ink);
}
.tag::after{ /* stamped edge */
  content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ink);
}
.tag .tag-code{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--slag);text-transform:uppercase}
.tag .tag-title{font-family:var(--disp);font-weight:700;font-size:21px;line-height:1.02;text-transform:uppercase;letter-spacing:.02em;margin:3px 0 5px}
.tag .tag-meta{font-family:var(--mono);font-size:11px;color:var(--slag);letter-spacing:.04em}
button.tag{cursor:pointer}
button.tag:hover{background:#fff;border-color:var(--lens)}
button.tag:hover::after{background:var(--lens)}

.tag.state-due::after{background:var(--straw)}
.tag.state-overdue::after{background:var(--cherry)}
.tag.state-done::after{background:var(--lens-2)}
.tag.state-locked{opacity:.62}
.tag.state-locked::after{background:var(--hair)}

.stamp{
  position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(-7deg);
  font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;
  border:2.5px solid var(--lens-2);color:var(--lens-2);padding:3px 9px;border-radius:2px;opacity:.85;
  white-space:nowrap;
}
.pill{
  display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 8px;border:1.5px solid currentColor;border-radius:2px;font-weight:600;
}
.pill.due{color:#8A6410;background:var(--straw-lt)}
.pill.overdue{color:var(--cherry);background:var(--cherry-lt)}
.pill.done{color:var(--lens-2);background:#D8E6DE}
.pill.locked{color:var(--slag);background:var(--zinc-dk)}

/* ---------- hero: this month ---------- */
.hero{
  background:var(--lens);color:#E8EDE7;border-radius:2px;padding:26px 24px;margin-bottom:8px;
  position:relative;overflow:hidden;
}
.hero::after{
  content:'';position:absolute;right:-40px;top:-40px;width:170px;height:170px;
  background:repeating-linear-gradient(45deg,rgba(232,237,231,.07) 0 8px,transparent 8px 16px);
}
.hero .eyebrow{color:#9BB6A8;margin-bottom:10px}
.hero h2{font-size:clamp(26px,6vw,38px);line-height:.95;margin-bottom:10px;color:#F2F5F0}
.hero .refs{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:#9BB6A8;margin-bottom:18px}
.hero .btn{background:var(--straw);border-color:var(--straw);color:#1A1405}
.hero .btn:hover{background:#DCA82A;border-color:#DCA82A}
.hero .btn.ghost{background:transparent;color:#E8EDE7;border-color:#7C9A8B}
.hero .btn.ghost:hover{background:#E8EDE7;color:var(--lens)}
.hero .done-note{font-family:var(--mono);font-size:12px;color:#B9D0C3;letter-spacing:.04em}

/* ---------- roster sign-in ---------- */
.grid-names{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.namebtn{

  font-family:var(--disp);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em;
  color:var(--ink);line-height:1.05;
}
.namebtn small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--slag);font-weight:400;margin-top:6px}
.namebtn:hover{background:var(--lens);color:#EEF0EA;border-color:var(--lens)}
.namebtn:hover small{color:#9BB6A8}
.namebtn .flag{color:var(--cherry)}
.namebtn:hover .flag{color:var(--straw)}

/* ---------- reader ---------- */
.reader{background:var(--plate);border:1.5px solid var(--ink);border-radius:2px;padding:24px 22px}
.reader ul{margin:0 0 14px;padding-left:20px}
.reader li{margin-bottom:7px}
.reader .lead{font-size:17px}
.stepbar{display:flex;gap:4px;margin-bottom:20px}
.stepbar i{flex:1;height:5px;background:var(--zinc-dk);border-radius:1px}
.stepbar i.on{background:var(--lens)}
.stepnum{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--slag);text-transform:uppercase;margin-bottom:14px}
.callout{border-left:4px solid var(--cherry);background:var(--cherry-lt);padding:12px 14px;margin:0 0 14px;font-size:14.5px}
.callout b{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:block;color:var(--cherry);margin-bottom:4px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}

/* ---------- quiz ---------- */
.q{background:var(--plate);border:1.5px solid var(--hair);border-radius:2px;padding:18px 18px 8px;margin-bottom:12px}
.q.flag-wrong{border-color:var(--cherry);border-width:2px}
.q.flag-right{border-color:var(--lens-2);border-width:2px}
.q .qn{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--slag);text-transform:uppercase}
.q .qt{font-weight:600;margin:5px 0 12px;font-size:15.5px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1.5px solid var(--hair);
  border-radius:2px;margin-bottom:8px;cursor:pointer;background:#fff;font-size:15px}
.opt:hover{border-color:var(--lens)}
.opt input{margin:3px 0 0;accent-color:var(--lens);width:19px;height:19px;flex:0 0 auto}
.opt.correct{border-color:var(--lens-2);background:#DEEAE3}
.opt.chosen-wrong{border-color:var(--cherry);background:var(--cherry-lt)}
.why{font-size:13.5px;color:var(--slag);border-top:1px solid var(--hair);padding:10px 0;margin-top:2px}

.result{border:2px solid var(--ink);background:var(--plate);border-radius:2px;padding:26px 22px;text-align:center;margin-bottom:18px}
.result .score{font-family:var(--disp);font-weight:800;font-size:58px;line-height:.9}
.result.pass{border-color:var(--lens-2)}
.result.pass .score{color:var(--lens-2)}
.result.fail{border-color:var(--cherry)}
.result.fail .score{color:var(--cherry)}
.result .verdict{font-family:var(--disp);font-weight:700;font-size:23px;text-transform:uppercase;letter-spacing:.1em;margin-top:4px}
.result .rmeta{font-family:var(--mono);font-size:11.5px;color:var(--slag);letter-spacing:.06em;margin-top:8px}

/* ---------- supervisor ---------- */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--ink);margin-bottom:22px;flex-wrap:wrap}
.tabs button{
  background:transparent;border:0;border-bottom:4px solid transparent;padding:11px 15px;

.matrix-scroll{overflow-x:auto;border:1.5px solid var(--ink);border-radius:2px;background:var(--plate)}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;

.cardbox{background:var(--plate);border:1.5px solid var(--ink);border-radius:2px;padding:20px;margin-bottom:16px}

.kpi b{display:block;font-family:var(--disp);font-weight:800;font-size:34px;line-height:1}

.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row2 > div{flex:1 1 160px}
label.fld{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--slag);margin-bottom:5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--plate);
  padding:12px 20px;border-radius:2px;font-size:14px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.28);max-width:90vw}
.warnbox{border-left:4px solid var(--straw);background:var(--straw-lt);padding:12px 14px;font-size:14px;margin-bottom:18px}

const firebaseConfig = {
  apiKey: "AIzaSyCcjsG598_9mMN4MM9XpI4XS9gzPxIlD-g",
  authDomain: "safety-test-66aa1.firebaseapp.com",
  projectId: "safety-test-66aa1",
  storageBucket: "safety-test-66aa1.firebasestorage.app",

const DOC_REF = () => fsDb.collection('wws').doc('training');

/* ---------- 12-month schedule + content ---------- */
const MODULES = [
{ id:'M01', month:'2026-08', title:'Heat Illness Under PPE', refs:'OSHA 5(a)(1) General Duty · NIOSH Criteria', cycle:'Seasonal — every summer', scope:'all', delivered:true,
  sections:[
   {h:'Why welders go down first', b:`<p class="lead">A welder in leathers, hood, and a long-sleeve FR shirt is wearing the equivalent of a personal greenhouse. The gear that protects you from spatter and UV also stops sweat from evaporating, and evaporation is how the body dumps heat.</p>
   <p>Stack that on top of radiant heat off the arc, off preheated plate, off a Decatur roof in August, and off the firebox of anything you're working next to. Two men in the same shop can be at very different risk depending on what they're wearing and what they're standing next to.</p>
   <ul><li>Heavy leathers and FR clothing cut evaporative cooling sharply.</li><li>Radiant heat from the arc, the plate, and the sun all add up.</li><li>Field work with no shade and no breeze is worse than the shop.</li><li>Enclosed or confined work — tanks, ductwork, crawl spaces — is the worst case.</li></ul>`},
   {h:'Getting acclimatized', b:`<p>Your body adapts to working in heat, but it takes days, not hours. Most fatal heat cases happen in the first few days on a hot job — new hires, guys back from vacation or medical leave, or anyone hitting the first real heat wave of the year.</p>
   <ul><li><b>New or returning worker:</b> roughly 20% of a normal hot-work shift on day one, adding about 20% each day.</li><li><b>Everybody, first hot spell of the year:</b> ease in. Being acclimatized last September does not carry over.</li><li>Acclimatization fades after about a week away from heat.</li></ul>
   <div class="callout"><b>Watch the new guy</b>A worker in his first week does not know his own limit yet and will not want to be the one who asks for a break. Somebody senior needs to be watching him.</div>`},
   {h:'Water, rest, shade', b:`<p>Thirst lags behind dehydration. By the time you feel thirsty you are already behind, and once you are behind it is hard to catch up during a shift.</p>
   <ul><li>About one cup of water every 15–20 minutes while working in heat — roughly a quart an hour. Not a gallon at lunch.</li><li>Cool water beats ice-cold; cold water is harder to drink in volume.</li><li>Take breaks out of the sun, hood off, jacket open, before you feel bad rather than after.</li><li>Energy drinks and heavy caffeine are not hydration. Alcohol the night before shows up the next afternoon.</li></ul>`},
   {h:'Heat exhaustion vs. heat stroke', b:`<p>These are two different things and only one of them is an emergency call.</p>
   <h3>Heat exhaustion</h3><ul><li>Heavy sweating, cool clammy skin</li><li>Weakness, dizziness, headache, nausea</li><li>Muscle cramps, fast weak pulse</li><li><b>Still thinking clearly.</b></li></ul>
   <h3>Heat stroke — call 911</h3><ul><li><b>Confusion, slurred speech, staggering, acting strange, passing out</b></li><li>Skin may be hot and dry, or still sweating — do not wait for dry skin</li><li>Very high body temperature, seizures</li></ul>
   <div class="callout"><b>The dividing line</b>Change in how somebody is thinking or acting. A man who cannot tell you where he is or who argues that he is fine while swaying on his feet is a heat stroke until proven otherwise.</div>`},
   {h:'What you do about it', b:`<h3>Heat exhaustion</h3><ul><li>Get him out of the heat and out of the gear — hood, jacket, sleeves off.</li><li>Cool water to drink, cool wet rags on the neck, head, armpits, groin.</li><li>Stay with him. If he does not clearly improve in about 15 minutes, or gets worse, treat it as heat stroke.</li></ul>
   <h3>Heat stroke</h3><ul><li><b>Call 911 first.</b></li><li>Start cooling immediately — do not wait for the ambulance. Strip the gear, cold water over the body, ice packs to neck/armpits/groin, fan him.</li><li>Nothing to drink if he is not fully alert.</li><li><b>Never leave him alone.</b></li></ul>
   <p>Tell your foreman if you are on a medication that affects sweating, blood pressure, or fluids, or if you have had a heat problem before. That stays between you and the shop and it changes how we watch you.</p>`}
  ],
  quiz:[
   {q:"Which sign points to heat stroke rather than heat exhaustion?",o:["Heavy sweating","Muscle cramps in the legs","Confusion or slurred speech","Feeling thirsty"],a:2,
    e:"Any change in mental status — confusion, slurred speech, staggering, passing out — means heat stroke. Call 911 and start cooling."},
   {q:"A new hire starts on a hot field job Monday. What should his first day look like?",o:["About 20% of a normal hot-work day, building up about 20% daily","Full shift but with extra water","Keep him inside all week","Full shift, he will adjust"],a:0,
    e:"Acclimatization takes days. Roughly 20% exposure on day one with about 20% more each day. Most heat fatalities hit workers in their first days on a hot job."},
   {q:"How should you take water in while working in heat?",o:["A gallon at lunch to load up","Only when you feel thirsty","Energy drinks instead of water","About a cup every 15–20 minutes"],a:3,
    e:"About a cup every 15–20 minutes, roughly a quart an hour. Thirst lags behind dehydration, so drinking on a schedule beats drinking on feel."},
   {q:"Why does welding PPE raise heat illness risk?",o:["It is heavier than street clothes","It traps heat and blocks sweat from evaporating","It is usually dark colored","It makes you drink less water"],a:1,
    e:"Evaporation is the body’s main cooling method. Leathers and FR clothing block it, so heat builds up even in moderate temperatures."},
   {q:"A coworker with heat stroke symptoms — what comes first?",o:["Walk him to his truck to rest","Give him cold water to drink","Call 911 and start cooling him right away","Wait 15 minutes to see if he improves"],a:2,
    e:"Heat stroke is a 911 call and cooling starts immediately. Waiting to see and giving fluids to someone not fully alert both cost time you do not have."}
  ]},

{ id:'M02', month:'2026-09', title:'Hot Work & Fire Prevention', refs:'29 CFR 1910.252(a) · NFPA 51B', cycle:'Annual', scope:'all', delivered:true,
  sections:[
   {h:'The 35-foot rule', b:`<p class="lead">Before an arc is struck or a torch is lit, combustibles come out of the area. If they cannot be moved, they get covered with flame-resistant guards or shields.</p>
   <ul><li><b>35 feet</b> in all directions from the work is the baseline clear radius.</li><li>Sparks and hot slag travel further than people expect, and they roll, bounce, and fall.</li><li>What counts as combustible: cardboard, rags, wood scrap, pallets, paint and solvent cans, plastic sheeting, insulation, dry vegetation, sawdust, oily floors.</li><li>Move the work to a safe place before you make the place safe for the work — if the part can come to the shop bay, bring it.</li></ul>`},
   {h:'Openings and what is on the other side', b:`<p>Most hot work fires do not start where the welder is looking. They start in the next room, in the floor below, or inside a wall.</p>
   <ul><li>Cracks in floors and walls, conveyor openings, and pipe penetrations within 35 feet get covered.</li><li>Check the far side of any wall or floor you are welding on — heat conducts straight through and can ignite what is stacked against it.</li><li>On grating and elevated decks, assume everything falls. Clear or shield the area below and keep people out of it.</li><li>Ductwork and conveyors can carry sparks a long way. Shut them down or block them.</li></ul>`},
   {h:'The fire watch', b:`<p>A fire watch is a job, not a title. Assign it to somebody who is doing nothing else.</p>
   <ul><li>Required whenever more than a minor fire could develop, or combustibles are closer than 35 feet, or combustibles on the other side of a wall or floor could ignite.</li><li>The watch must be trained on the extinguisher, know how to sound the alarm, and stay in the area.</li><li>The watch keeps watching <b>at least 30 minutes after the work stops</b>, and then does a final check of the whole area including adjacent spaces.</li><li>Smoldering fires in insulation, wood, or debris can take that long to show themselves.</li></ul>
   <div class="callout"><b>No fire watch, no hot work</b>If the area needs a watch and nobody is free to be the watch, the work waits. That is not a judgment call to make alone — get the foreman.</div>`},
   {h:'Containers, tanks, and piping', b:`<p>This is where hot work kills people.</p>
   <ul><li><b>Never</b> cut or weld on a drum, tank, or pipe that held a flammable or unknown substance until it has been cleaned, purged, and tested safe.</li><li>"It smells empty" is not tested. Residue and vapor in an empty container is the explosive condition — a full one has no room for air.</li><li>Hollow or sealed members can build pressure when heated. Vent them.</li><li>Painted, coated, galvanized, or lined surfaces need to be considered for both fire and fume before you start.</li></ul>`},
   {h:'Equipment and housekeeping', b:`<ul><li>An extinguisher of the right type stays within immediate reach — not around the corner.</li><li>Inspect leads, holders, torches, and hoses before use. A damaged lead is both a shock hazard and an ignition source.</li><li>Shut off machines and close cylinder valves when you break for lunch or the end of the day.</li><li>Do not lay a hot electrode holder or torch down on the bench where it can arc or ignite something.</li><li>Sweep up. A shop floor covered in grinding dust, cardboard, and oily rags is a fire waiting on a spark.</li></ul>`}
  ],
  quiz:[
   {q:"What is the baseline radius for clearing combustibles around hot work?",o:["35 feet","50 feet","10 feet","20 feet"],a:0,
    e:"35 feet in all directions. If combustibles cannot be moved, they get shielded with flame-resistant covers."},
   {q:"How long must a fire watch stay after the welding stops?",o:["5 minutes","No watch needed once the arc is off","Until the metal cools to the touch","At least 30 minutes, then a final check"],a:3,
    e:"At least 30 minutes of continued watch, then a full check of the area and adjacent spaces. Smoldering fires take time to show."},
   {q:"You need to weld a bracket on a drum that used to hold solvent. What do you do?",o:["Fill it with water first and go ahead","Do not weld until it is cleaned, purged, and tested safe","Weld only on the outside","Weld it if the drum smells empty"],a:1,
    e:"Residual vapor in an \"empty\" container is the explosive condition. Cleaned, purged, and tested — no shortcuts, no exceptions."},
   {q:"Why check the far side of a wall before welding on it?",o:["It is not necessary if the wall is steel","To see if the paint matches","Heat conducts through and can ignite combustibles stacked on the other side","To find the studs"],a:2,
    e:"Conducted heat through a wall or floor ignites what is stacked against it. Fires start where the welder cannot see them."},
   {q:"Who can serve as fire watch?",o:["A trained person assigned to that job and nothing else","The welder, watching between passes","The foreman, from the office","Anybody standing nearby"],a:0,
    e:"The watch does nothing else, is trained on the extinguisher, knows how to sound the alarm, and stays in the area."}
  ]},

{ id:'M03', month:'2026-10', title:'Welding Fume & Respiratory Protection', refs:'29 CFR 1910.252(c) · 1910.134 · 1910.1026', cycle:'Annual', scope:'all',
  sections:[
   {h:'What is actually in the smoke', b:`<p class="lead">Welding fume is not smoke from burning something. It is metal boiled off and condensed into particles small enough to reach deep into your lungs. What is in it depends on the base metal, the coating on it, and the rod or wire.</p>
   <ul><li><b>Manganese</b> — in mild steel and most filler metals. Long-term overexposure causes permanent nerve damage that looks like Parkinson's.</li><li><b>Hexavalent chromium</b> — from stainless steel and chrome-bearing alloys. A known carcinogen with its own OSHA standard.</li><li><b>Nickel</b> — stainless and nickel alloys. Carcinogen, respiratory sensitizer.</li><li><b>Zinc</b> — from galvanized. Causes metal fume fever.</li><li><b>Cadmium and lead</b> — from some coatings, platings, and old paint. Serious acute and chronic toxicity.</li><li><b>Gases</b> — ozone, nitrogen oxides, carbon monoxide, and phosgene where chlorinated solvents are present.</li></ul>`},
   {h:'Galvanized and metal fume fever', b:`<p>Welding or cutting galvanized steel puts zinc oxide in the air. Symptoms usually show up several hours later, often that evening: chills, fever, sweats, aching, metallic taste, headache, nausea. It passes in a day or two and people write it off as a bug.</p>
   <ul><li>Grind the coating back from the joint where the design allows it.</li><li>Position yourself out of the plume and use source capture.</li><li>Repeated episodes are not something to shrug off — report it.</li></ul>
   <div class="callout"><b>Do not clean with chlorinated solvent</b>Brake cleaner and similar chlorinated degreasers near an arc can form phosgene gas. Use only approved cleaners on anything headed for the weld table.</div>`},
   {h:'Ventilation comes before the respirator', b:`<p>Controls run in order. A respirator is the last line, not the first.</p>
   <ol><li><b>Substitute</b> — a lower-fume process or consumable where the job allows it.</li><li><b>Local exhaust ventilation</b> — capture at the source. A fume extraction arm, downdraft table, or extraction gun placed close to the arc removes fume before it reaches your face. Placement matters more than airflow rating: a hood two feet away does almost nothing.</li><li><b>General ventilation</b> — dilutes the shop air. Helps the room, not the welder in the plume.</li><li><b>Position</b> — keep your head out of the plume. Do not lean over the work into the rising fume.</li><li><b>Respirator</b> — when the above cannot get exposure low enough.</li></ol>
   <p>Fans that just blow across the work can push fume into someone else's breathing zone, and on shielded processes they blow away shielding gas and wreck the weld.</p>`},
   {h:'Confined and enclosed spaces', b:`<p>Welding inside a tank, vessel, pit, or tight enclosure changes everything.</p>
   <ul><li>Shielding gas — argon, CO2, helium — displaces oxygen and pools in low areas. It is odorless. Men die in these spaces without ever knowing anything was wrong.</li><li>Test the atmosphere before entry and monitor continuously. Continuous mechanical ventilation is required.</li><li>An attendant stays outside with a means of rescue. Never enter to pull someone out yourself without air and a plan.</li><li>Take cylinders and welding machines <b>outside</b> the space. Only the torch, gun, or holder goes in.</li><li>When you break, take the electrode holder or gun out of the space and shut the gas off at the cylinder.</li></ul>`},
   {h:'Respirator rules', b:`<p>If a tight-fitting respirator is required for a task, three things must happen before you put it on:</p>
   <ul><li><b>Medical evaluation</b> — a written questionnaire or exam clearing you to wear one.</li><li><b>Fit test</b> — on the make, model, and size you will actually wear, repeated annually.</li><li><b>User seal check</b> — every single time you put it on.</li></ul>
   <p>Additional rules:</p>
   <ul><li><b>No facial hair crossing the sealing surface.</b> Not stubble, not a few days growth. A beard defeats the seal and nothing else will fix it.</li><li>Use the right cartridge or filter. A dust mask does not stop gases.</li><li>A loose-fitting PAPR is an option where a tight seal is not workable — different rules, still requires medical evaluation and training.</li><li>Inspect, clean, and store your respirator. A cracked facepiece or a stretched strap is out of service.</li><li>An N95 worn voluntarily when not required has fewer requirements but still needs to fit and needs the shop to know about it.</li></ul>`}
  ],
  quiz:[
   {q:"What is the first line of defense against welding fume?",o:["A shop fan blowing across the bench","Growing used to it","A P100 respirator","Local exhaust ventilation capturing fume at the source"],a:3,
    e:"Engineering controls come first. Source capture placed close to the arc removes fume before it reaches your breathing zone. Respirators are the last line."},
   {q:"Welding stainless steel produces which hazard of particular concern?",o:["Zinc oxide","Hexavalent chromium","Carbon monoxide only","Phosgene"],a:1,
    e:"Stainless and chrome alloys generate hexavalent chromium, a known carcinogen with its own OSHA standard, 1910.1026."},
   {q:"A man who cut galvanized this afternoon has chills, fever, and aching by 9 pm. Most likely cause?",o:["A cold going around the shop","Arc eye","Metal fume fever from zinc oxide","Heat exhaustion"],a:2,
    e:"Metal fume fever from zinc oxide. Delayed onset by several hours is the classic pattern and it gets mistaken for the flu."},
   {q:"Before wearing a tight-fitting respirator on a required task you need:",o:["Medical evaluation, fit test, and a seal check each time","Only a fit test","Only the foreman’s approval","Nothing, just put it on"],a:0,
    e:"Medical evaluation, fit test on that exact make/model/size, and a user seal check every time. Facial hair at the seal disqualifies you."},
   {q:"The main atmospheric danger when welding inside a tank is:",o:["Heat only","Loud noise","Too much oxygen","Shielding gas displacing oxygen"],a:3,
    e:"Argon, CO2, and helium displace oxygen, are odorless, and pool in low spots. Test and monitor the atmosphere, ventilate continuously, and post an attendant."}
  ]},

{ id:'M04', month:'2026-11', title:'Eye, Face & Skin Protection', refs:'29 CFR 1910.132 · 1910.133 · ANSI Z87.1', cycle:'Annual', scope:'all',
  sections:[
   {h:'What the arc does to your eyes', b:`<p class="lead">A welding arc puts out intense ultraviolet, visible, and infrared radiation. UV burns the surface of the eye — photokeratitis, what everybody calls arc eye or a flash burn.</p>
   <ul><li>Symptoms show up <b>hours later</b>, usually that night: feels like sand in the eye, tearing, light sensitivity, pain.</li><li>It usually heals in a day or two but it is genuinely miserable and it means you took a dose.</li><li>Repeated exposure over years is linked to cataracts.</li><li>Infrared can cause retinal damage. Visible light intensity causes flash blindness.</li></ul>
   <p>You do not have to be the welder. Most flash burns happen to somebody walking past, fitting up nearby, or holding a part.</p>`},
   {h:'Picking the right shade', b:`<p>Too light lets radiation through. Too dark makes you crowd the puddle to see it, which puts your face in the fume and hurts the weld. Use the lightest shade that gives you a comfortable view of the puddle, but never below the minimum.</p>
   <ul><li><b>SMAW, 5/32 in. electrode and under:</b> minimum shade 10</li><li><b>SMAW, heavier electrodes / higher current:</b> shade 12 and up</li><li><b>GMAW and FCAW:</b> shade 10 to 11, higher on heavy current</li><li><b>GTAW:</b> shade 10 to 12 depending on current and material</li><li><b>Carbon arc, plasma:</b> shade 12 to 14</li><li><b>Oxy-fuel cutting and heavy gas welding:</b> shade 4 to 6</li><li><b>Torch brazing and soldering:</b> shade 3 to 4</li></ul>
   <p>Check the standard's table when you are unsure. An auto-darkening hood still needs the shade set correctly, and it needs its sensors clean and its battery good — test it before you rely on it.</p>`},
   {h:'Layers, not one thing', b:`<ul><li><b>Safety glasses under the hood, always.</b> ANSI Z87.1 with side shields. The hood goes up constantly for chipping, tacking, and checking, and that is when things get in your eye.</li><li><b>Grinding:</b> face shield <i>and</i> safety glasses. A shield alone lets debris up from underneath. A wheel that comes apart at speed is not stopped by glasses alone.</li><li><b>Chipping slag:</b> glasses at minimum, shield preferred. Hot slag has a way of finding an eye.</li><li><b>Overhead work:</b> button the collar, cape the hood, and expect everything to come straight back down at your face.</li></ul>`},
   {h:'Protecting everyone else', b:`<ul><li>Put up noncombustible screens or welding curtains before you strike an arc anywhere near other people or a walkway.</li><li>Call out before you strike in an open bay — the courtesy warning is a real control.</li><li>Curtains need to be positioned so somebody cannot see the arc under or around them, and hung so they do not block egress.</li></ul>`},
   {h:'Skin and clothing', b:`<p>Arc UV burns skin like a bad sunburn, and it does it fast at close range. That is on top of spatter, slag, and radiant heat.</p>
   <ul><li>Long sleeves down and buttoned, collar closed. No rolled sleeves, no open shirt.</li><li>Leathers for heavy work, overhead, and out-of-position.</li><li><b>No synthetics.</b> Polyester and nylon melt into skin. Cotton, wool, leather, or FR only — and untreated cotton can still catch, so FR is the standard.</li><li>Cuffless pants, worn over the boots, not tucked in. Cuffs and open pockets catch slag and hold it against you.</li><li>No frayed or oily clothing. Oil-soaked cloth ignites readily.</li><li>Gauntlet gloves in good condition. Leather boots, 6 in. or taller, no exposed sock or ankle.</li><li>Take the lighter out of your pocket. Take the phone out of a chest pocket where slag lands.</li></ul>`}
  ],
  quiz:[
   {q:"When do arc eye symptoms usually appear?",o:["Immediately","Hours later, often that night","Only the next week","Only if you look directly at the arc"],a:1,
    e:"Delayed by several hours, typically showing up that evening as a gritty feeling, tearing, and light sensitivity. Delay is why people underestimate the exposure."},
   {q:"What is the minimum filter shade for SMAW with a 5/32 in. electrode?",o:["Shade 5","Shade 8","Shade 10","Shade 14"],a:2,
    e:"Shade 10 minimum. Heavier electrodes and higher current call for shade 12 and up. Use the lightest shade at or above the minimum that lets you see the puddle."},
   {q:"What do you wear under the welding hood?",o:["ANSI Z87.1 safety glasses with side shields","Reading glasses if needed","A dust mask only","Nothing else is needed"],a:0,
    e:"Z87.1 glasses with side shields, always. The hood comes up dozens of times a shift and that is when debris gets in."},
   {q:"Which clothing is unacceptable for welding?",o:["Cuffless pants over the boots","Buttoned cotton FR long sleeves","Leather gauntlet gloves","A polyester shirt"],a:3,
    e:"Synthetics melt into skin. Cotton FR, wool, and leather only, with cuffless pants worn over the boots and no oily or frayed clothing."},
   {q:"How do you keep from flashing others in an open bay?",o:["Weld fast","Set up noncombustible screens or curtains and warn people","Ask them to look away","Turn the amps down"],a:1,
    e:"Noncombustible screens or welding curtains, positioned so nobody can catch the arc around or under them, plus a verbal warning before you strike."}
  ]},

{ id:'M05', month:'2026-12', title:'Compressed Gas Cylinders & Oxy-Fuel', refs:'29 CFR 1910.253 · 1910.101', cycle:'Annual', scope:'all',
  sections:[
   {h:'A cylinder is a bomb with a valve on it', b:`<p class="lead">A full cylinder holds enough stored energy that snapping the valve off turns it into a rocket capable of going through a block wall. Nearly every serious cylinder incident traces back to handling, not to the gas.</p>
   <ul><li>Stored, moved, and used <b>upright and secured</b> — chain, strap, or cylinder cart. Never freestanding, never lying loose in a truck bed.</li><li><b>Valve cap on</b> any time the cylinder is not in use and any time it is being moved.</li><li>Never lift by the cap or the valve. Use a cradle, cage, or proper cart. A sling or magnet on a bare cylinder is not acceptable.</li><li>Do not drop, strike, or use a cylinder as a roller, support, or workpiece.</li><li>Never strike an arc on a cylinder or let a work lead touch one.</li></ul>`},
   {h:'Storage and separation', b:`<ul><li><b>Oxygen and fuel gas cylinders must be separated by 20 feet, or by a noncombustible barrier at least 5 feet high with a fire-resistance rating of at least a half hour.</b></li><li>Keep cylinders away from heat, sparks, slag, open flame, and electrical circuits.</li><li>Store fulls and empties separately and mark empties MT.</li><li>Do not store cylinders in stairwells, exits, or where they can be knocked over by traffic.</li><li>Never store cylinders in an unventilated closed space, including a van or truck box.</li></ul>`},
   {h:'Oxygen and oil do not mix', b:`<p>Pure oxygen makes things burn that normally would not, and makes ordinary combustibles burn violently. Oil or grease in an oxygen system can ignite from the heat of compression alone.</p>
   <ul><li><b>No oil, grease, or oily rags</b> on oxygen cylinders, valves, regulators, hoses, or fittings — and no oily gloves handling them.</li><li>Open the oxygen cylinder valve <b>slowly</b> to let the regulator come up gradually.</li><li>Never use oxygen to blow off dust, cool yourself, purge a line, or pressurize anything. Oxygen-saturated clothing ignites from a spark and burns fiercely.</li><li>Never use a fuel-gas regulator on oxygen or vice versa. Never modify or force a fitting.</li></ul>
   <div class="callout"><b>Oxygen is not air</b>Using oxygen where you would use shop air is a recurring cause of fatal burn injuries. Air is air. Oxygen is not.</div>`},
   {h:'Acetylene specifics', b:`<ul><li><b>Never exceed 15 psig working pressure on acetylene.</b> Above that it becomes unstable and can decompose explosively with no oxygen present at all.</li><li>Acetylene cylinders must be used and stored <b>upright</b>. The cylinder is packed with a porous filler saturated in acetone; on its side the acetone comes out with the gas.</li><li>If a cylinder has been on its side, stand it upright for at least 30 minutes — an hour is better — before use.</li><li>Open the acetylene valve no more than about three-quarters of a turn to one full turn so it can be shut fast.</li><li>Acetylene attacks copper. Never use copper tubing or copper-bearing fittings on an acetylene line.</li></ul>`},
   {h:'Torch setup, use, and shutdown', b:`<h3>Setup</h3>
   <ul><li>Inspect hoses for burns, cracks, worn spots, and loose connections. Repair with proper couplings — no tape.</li><li><b>Reverse-flow check valves and flashback arrestors</b> installed and working.</li><li>Crack the cylinder valve away from people to blow out dust before mounting the regulator.</li><li>Leak test with approved leak detection solution or soapy water. <b>Never with a flame.</b></li></ul>
   <h3>Use</h3>
   <ul><li>Light with a <b>friction striker</b>. Never a lighter, never matches, never off hot metal.</li><li>Correct tip for the job, clean, with the right tip cleaner. Do not enlarge an orifice with a drill or wire.</li><li>A popping or squealing torch means shut it down — that is backfire and it precedes flashback.</li><li>Do not hang a lit or unlit torch on a cylinder or regulator.</li></ul>
   <h3>Shutdown</h3>
   <ul><li>Close cylinder valves, bleed the lines, back the regulator adjusting screws out, coil the hose off the floor.</li><li>Close valves and secure everything at lunch and end of shift, not just at the end of the job.</li></ul>`}
  ],
  quiz:[
   {q:"What is the maximum working pressure for acetylene?",o:["50 psig","5 psig","15 psig","30 psig"],a:2,
    e:"15 psig. Above that acetylene can decompose explosively with no oxygen present."},
   {q:"How must oxygen and fuel gas cylinders be separated in storage?",o:["3 feet apart","Only by a painted line on the floor","They can be stored together if capped","20 feet apart, or a 5 ft noncombustible barrier with a half-hour fire rating"],a:3,
    e:"20 feet, or a noncombustible barrier at least 5 feet high rated for at least a half hour of fire resistance."},
   {q:"Why is oil or grease dangerous around oxygen equipment?",o:["Oxygen makes it ignite violently, sometimes from compression heat alone","It voids the warranty","It is not dangerous, only messy","It gums up the regulator"],a:0,
    e:"Pure oxygen makes ordinary combustibles burn violently and can ignite oil from the heat of compression. No oil, grease, or oily gloves near oxygen."},
   {q:"You are moving a cylinder across the shop. What is required?",o:["Lift it by the cap with the crane","Valve closed, cap on, secured to a cart","Roll it on its side","Carry it by the valve"],a:1,
    e:"Valve closed, cap on, upright and secured to a cart. Never lift or carry by the cap or valve, and never use a sling or magnet on a bare cylinder."},
   {q:"Can you use oxygen to blow dust off your clothes?",o:["Only with a regulator set low","Yes, it is cleaner than shop air","Yes, if you keep it brief","Never — oxygen-saturated clothing ignites from a spark"],a:3,
    e:"Never. Oxygen-saturated clothing catches from the smallest spark and burns fiercely. This is a recurring cause of fatal burns."}
  ]},

{ id:'M06', month:'2027-01', title:'Lockout / Tagout & Machine Guarding', refs:'29 CFR 1910.147 · 1910.212 · 1910.219', cycle:'Annual', scope:'all',
  sections:[
   {h:'Hazardous energy is more than the plug', b:`<p class="lead">Lockout/tagout is required any time servicing or maintenance could expose you to unexpected startup, energization, or release of stored energy — and where you would have to bypass a guard or put any part of your body into a danger zone.</p>
   <p>Energy types to account for on shop equipment:</p>
   <ul><li><b>Electrical</b> — line power, control circuits, backfeed from another source</li><li><b>Stored electrical</b> — capacitors in drives, welders, and controls</li><li><b>Hydraulic and pneumatic</b> — pressure held in cylinders, accumulators, and lines</li><li><b>Mechanical</b> — springs, tensioned belts, flywheels still coasting</li><li><b>Gravity</b> — a raised platen, ram, table, or suspended load that can drop</li><li><b>Thermal</b> — hot surfaces and fluids</li></ul>
   <p>In a fab shop this means the ironworker, shear, press brake, band saw, drill press, roll, grinder, conveyor, and compressor — plus welding machines when you open a case.</p>`},
   {h:'The six steps', b:`<ol><li><b>Prepare</b> — know the machine, know every energy source, know the written procedure.</li><li><b>Shut down</b> — normal stopping procedure, not the e-stop as a routine method.</li><li><b>Isolate</b> — operate the energy-isolating device: disconnect, breaker, valve. A control switch or e-stop is <b>not</b> an isolating device.</li><li><b>Lock and tag</b> — your own lock, your own tag with your name on it, on every isolating device.</li><li><b>Release stored energy</b> — block or lower gravity loads, bleed pressure, discharge capacitors, let rotating parts stop.</li><li><b>Verify</b> — try to start the machine, test with a meter, confirm zero energy state. Then return the controls to off.</li></ol>
   <div class="callout"><b>Step 6 is the one people skip</b>Verification is the step that catches the wrong breaker, the second feed, and the accumulator nobody knew about. If you did not verify, you are not locked out.</div>`},
   {h:'Locks, tags, and who removes what', b:`<ul><li><b>Each authorized employee applies their own personal lock.</b> If four people are working, four locks are on it, using a hasp or a group lock box.</li><li><b>Only the person who applied a lock removes it.</b> The only exception is a documented procedure with specific steps — verified attempts to reach the person, area cleared, and notification before they return to work. That is a supervisor action, not a shortcut.</li><li>Locks are for lockout only. Do not use a lockout padlock on a toolbox, and do not use your toolbox lock for lockout.</li><li>Tag-only is permitted only where an energy-isolating device physically cannot accept a lock, and then the tag has to provide protection equal to a lock with at least one additional safety measure.</li><li>A tag is a warning. It stops nothing by itself.</li></ul>`},
   {h:'Shift change and contractors', b:`<ul><li>Locks stay on across shift change. The oncoming worker applies his lock before the outgoing worker removes his — there is never a gap.</li><li>When an outside contractor works on our equipment, both sides brief each other's procedures and both apply locks.</li><li>When we work in a customer's plant, we follow their LOTO program and apply our own locks. Never rely on their word that something is dead — verify it yourself.</li></ul>`},
   {h:'Machine guarding', b:`<p>Guards protect against the point of operation, rotating parts, flying chips, and sparks.</p>
   <ul><li><b>Never operate a machine with a guard removed, defeated, or tied back.</b></li><li>If a guard has to come off for maintenance, the machine is locked out, and the guard goes back on before anything is restarted.</li><li>Report a guard that is missing, damaged, or interferes with the work — do not fix the problem by removing it.</li><li>Anchor and secure the machine so it cannot walk or tip during operation.</li><li>Point-of-operation guarding on the ironworker, shear, and brake: keep hands out of the die and pinch points, use hold-downs and reach tools, and do not hold short pieces by hand.</li><li>Rotating shafts, belts, sheaves, and couplings within 7 feet of the floor or work surface get guarded.</li><li>No loose clothing, no gloves, no jewelry, no untucked shirt tails around rotating equipment.</li></ul>`}
  ],
  quiz:[
   {q:"Who may remove a lockout lock?",o:["Only the person who applied it, except by a documented procedure","Maintenance only","Anyone on the crew","The foreman at any time"],a:0,
    e:"Only the employee who applied it. The narrow exception requires a documented procedure with verified attempts to reach the person and notification before they resume work."},
   {q:"Which LOTO step gets skipped most often?",o:["Applying the lock","Verifying zero energy by trying to start and testing","Notifying affected employees","Shutting the machine down"],a:1,
    e:"Verification. It is what catches the wrong breaker, a second feed, or an accumulator nobody knew about. Without it you are not locked out."},
   {q:"Which is an example of stored energy?",o:["The main disconnect being off","A tagged breaker","A machine sitting idle","A hydraulic accumulator still under pressure"],a:3,
    e:"Hydraulic and pneumatic pressure, springs, coasting flywheels, capacitors, and raised or suspended loads all hold energy after the power is off."},
   {q:"When is tag-only acceptable instead of a lock?",o:["Whenever a lock is inconvenient","On short jobs under an hour","Only where the isolating device cannot accept a lock, plus an additional safety measure","Never under any circumstances"],a:2,
    e:"Only where the device physically cannot be locked, and then the tag must provide protection equal to a lock with at least one additional safety measure."},
   {q:"A guard was removed to clear a jam. What has to happen?",o:["Run it carefully without the guard","The machine stays locked out and the guard goes back on before restart","Tape a warning sign over the opening","Leave it off if it slows the work"],a:1,
    e:"Machine locked out while the guard is off, guard reinstalled before anything restarts. Never operate with a guard removed or defeated."}
  ]},

{ id:'M07', month:'2027-02', title:'Grinding & Abrasive Wheels', refs:'29 CFR 1910.215 · ANSI B7.1', cycle:'Annual', scope:'all',
  sections:[
   {h:'The wheel is the hazard', b:`<p class="lead">An abrasive wheel spinning at 10,000+ rpm that comes apart sends pieces out at bullet speed. Grinder injuries in a fab shop are common, and the bad ones are almost always a wheel failure or a removed guard.</p>
   <ul><li><b>Match the ratings.</b> The maximum rpm marked on the wheel must be equal to or greater than the no-load rpm of the tool. A 4-1/2 in. wheel on a 4-1/2 in. grinder is not automatic — read both.</li><li><b>Inspect every wheel before mounting.</b> Look for cracks, chips, gouges, water damage, and warping.</li><li><b>Ring test</b> vitrified wheels: hang the wheel on a finger or pin and tap the side with a non-metallic handle about 45° off vertical, both sides. A sound wheel rings. A dead thud means scrap it. Ring testing does not apply to thin organic-bonded or reinforced cutoff wheels — inspect those visually.</li><li>Mount with matching blotters and correct flanges, snug but not overtightened. Never force a wheel onto a spindle or bush a hole to fit.</li><li><b>Run a newly mounted wheel at full speed for at least one minute</b> with everyone standing out of the plane of the wheel before you put it to work.</li></ul>`},
   {h:'Bench and pedestal grinder clearances', b:`<p>Two small gaps do most of the work of keeping a bench grinder from grabbing a part:</p>
   <ul><li><b>Work rest: 1/8 in. maximum</b> from the wheel face. Any more and the part gets pulled into the gap and jams.</li><li><b>Tongue guard (adjustable top guard): 1/4 in. maximum</b> from the wheel.</li><li>These are adjusted with the wheel <b>stopped</b>, and they need readjusting as the wheel wears down.</li><li>Maximum exposure angle on a bench or pedestal grinder is 90°, and no more than 65° above the horizontal plane of the spindle.</li></ul>
   <div class="callout"><b>The gap grows on its own</b>Every time the wheel wears, both clearances open up. A grinder that was compliant last month may not be today. Check it before you use it.</div>`},
   {h:'Right wheel, right way', b:`<ul><li><b>Never side-grind on a Type 1 cutoff wheel.</b> It is built for edge loading only. Side pressure cracks it.</li><li>Do not use a cutoff wheel in a grinder unless the wheel is rated for that tool and the guard is correct for cutting.</li><li>Grinding wheel for grinding, cutting wheel for cutting, flap disc for blending. Do not improvise.</li><li>Do not grind aluminum, brass, or other soft metal on a wheel meant for steel — it loads the wheel and can cause it to burst. Keep a dedicated wheel or use a different method.</li><li><b>Never grind stainless on a wheel used for carbon steel</b> if the part matters — and be aware stainless grinding dust carries chromium.</li><li>Let the tool come up to speed before contact and let it stop on its own — do not set a coasting grinder down.</li><li>Ease into the cut. Do not lean on it; excessive pressure overheats and stresses the wheel.</li></ul>`},
   {h:'Portable grinders and kickback', b:`<ul><li><b>The guard stays on.</b> A portable grinder guard covers a maximum of 180°, positioned between you and the wheel. Guards get removed for access, and that is how hands and faces get opened up.</li><li>Two hands on the tool with the side handle installed. Keep the cord and lead clear of the wheel.</li><li>Position yourself so the sparks and any wheel fragments go away from you and away from other people, gas cylinders, and combustibles.</li><li>Kickback comes from pinching the wheel in the cut, catching an edge, or plunging. Support the work so the cut cannot close on the wheel.</li><li>Never lock the trigger or wedge the switch on.</li><li>Check that the wheel is seated and the nut tight before every use. Do not change wheels with the tool plugged in.</li></ul>`},
   {h:'PPE and housekeeping', b:`<ul><li><b>Face shield and safety glasses.</b> Both. Not one.</li><li>Hearing protection — grinders routinely exceed 100 dBA.</li><li>Respiratory protection where the material or coating calls for it. Grinding paint, galvanizing, or stainless puts metal in the air.</li><li>No gloves that can catch, no loose sleeves, nothing dangling.</li><li>Grinding dust is combustible. Sweep it up, keep it away from hot work, and empty collection systems.</li><li>Tag out and report any grinder with a damaged guard, worn spindle, loose bearing, or bad cord. Do not use it and do not let anybody else.</li></ul>`}
  ],
  quiz:[
   {q:"What must be checked before mounting an abrasive wheel?",o:["The wheel color","Nothing if it is new in the box","Only that it fits the spindle","Ring test, visual inspection, and that wheel rpm rating meets or exceeds the tool rpm"],a:3,
    e:"Ring test vitrified wheels, inspect for cracks and damage, and confirm the wheel’s max rpm is at or above the tool’s no-load rpm."},
   {q:"Maximum work rest clearance on a bench grinder?",o:["1/8 in.","1/4 in.","1/2 in.","1/16 in."],a:0,
    e:"1/8 in. maximum. Readjust with the wheel stopped as the wheel wears."},
   {q:"Maximum tongue guard distance from the wheel?",o:["1 in.","1/8 in.","1/4 in.","1/2 in."],a:2,
    e:"1/4 in. maximum. Like the work rest, it opens up as the wheel wears and needs regular adjustment."},
   {q:"After mounting a new wheel, what do you do first?",o:["Start grinding immediately","Run it at full speed at least one minute with everyone out of the wheel plane","Tap it with a hammer while it spins","Grind a scrap piece to break it in"],a:1,
    e:"Run at full operating speed at least one minute, standing out of the plane of rotation. A defective wheel usually fails in that first minute."},
   {q:"The guard is in the way of the cut. What do you do?",o:["Find the right tool, wheel, or approach — the guard stays on","Remove it but wear a face shield","Remove it for this one cut","Rotate it out of the way"],a:0,
    e:"The guard stays on. If it will not work with the guard, the tool or approach is wrong for the job."}
  ]},

{ id:'M08', month:'2027-03', title:'Fall Protection & Steel Erection', refs:'29 CFR 1926.501 · 1926 Subpart R · 1926.760', cycle:'Annual', scope:'field',
  sections:[
   {h:'Trigger heights', b:`<p class="lead">Different heights apply depending on what work you are doing. Know which rule you are under before you get up there.</p>
   <ul><li><b>General construction (1926.501): 6 feet.</b> Unprotected sides and edges, holes, leading edges, roofs, formwork, walkways over dangerous equipment.</li><li><b>Steel erection (Subpart R): 15 feet</b> for most workers.</li><li><b>Connectors: over 15 feet and up to 30 feet</b> must be provided with fall protection and wear the equipment, and must have the option to tie off or be provided another means.</li><li><b>Controlled decking zone:</b> deckers between 15 and 30 feet may work without tying off only inside a properly established and marked CDZ under specific conditions.</li><li><b>General industry (1910.28): 4 feet</b> — applies to our own shop platforms, mezzanines, and open-sided floors.</li></ul>
   <p>When two rules could apply, work to the more protective one.</p>`},
   {h:'Personal fall arrest systems', b:`<p>Anchorage, body harness, connector. All three or it is not a system.</p>
   <ul><li><b>Anchorage:</b> capable of 5,000 lb per attached person, or designed by a qualified person with a safety factor of at least two. Independent of any anchorage used to support or suspend platforms.</li><li>Anchor <b>at or above</b> the D-ring where possible to limit free fall.</li><li><b>Free fall limited to 6 feet</b> and you must not contact a lower level. Arresting force on the body kept to 1,800 lb with a harness.</li><li>Full body harness only. Body belts are not permitted for fall arrest.</li><li>Snap hooks must be locking type. <b>No hook-to-hook, no hook to a D-ring not designed for it, no tying a knot in a lanyard, and no attaching to a lanyard loop or webbing.</b></li><li>Calculate your clearance: lanyard length + deceleration distance + harness stretch + your height below the D-ring + safety margin. A 6 ft lanyard needs roughly 18-1/2 ft of clearance. On a low tie-off, use a self-retracting lifeline instead.</li></ul>`},
   {h:'Inspect it every time', b:`<p>Welders destroy fall gear faster than anyone because slag, sparks, and hot metal land on it.</p>
   <ul><li><b>Webbing:</b> cuts, frays, burns, glazing, melting, chemical damage, pulled or broken stitching, discoloration.</li><li><b>Hardware:</b> cracks, deformation, corrosion, sharp edges, gates that do not lock.</li><li><b>Deceleration pack:</b> any sign of deployment or a broken warning flag.</li><li><b>Labels:</b> legible, with manufacture date. Follow the manufacturer's service life.</li><li><b>Any harness or lanyard that arrested a fall comes out of service permanently.</b> Same for anything with hot slag damage. Tag it, cut it, and throw it away so nobody puts it back in the truck.</li></ul>
   <div class="callout"><b>Slag and synthetic webbing</b>One spark can glaze or melt webbing to a fraction of its strength with almost nothing to see. If it might have taken slag, inspect it hard, and consider a leather protector or a wire rope lanyard for hot work.</div>`},
   {h:'Openings, edges, and access', b:`<ul><li>Holes and openings get covered with material capable of at least twice the intended load, secured against displacement, and marked HOLE or COVER.</li><li>Never step on an unmarked cover, never move one without protecting the opening.</li><li>Guardrails: top rail 42 in. ±3, capable of 200 lb applied outward and downward, midrail, and toeboards where things can fall on people below.</li><li>Do not use a guardrail as an anchor point unless it was engineered for it. It is designed to stop a lean, not a fall.</li><li>Ladders: 4:1 pitch, 3 ft above the landing or a grab rail, tied off at the top, three points of contact, face the ladder, no carrying loads that break your grip, no top two rungs of a stepladder.</li><li>Aerial lifts: harness tied to the manufacturer's anchor point inside the basket, gate closed, no standing on the rails, no climbing out at height.</li></ul>`},
   {h:'Rescue', b:`<p>Arresting the fall is only half of it. A man hanging in a harness is on a clock.</p>
   <ul><li>Suspension trauma can cause loss of consciousness in as little as a few minutes to a half hour depending on the person and the position.</li><li><b>There has to be a rescue plan before anybody goes up</b> — who, with what equipment, how long. "Call 911" is not a plan by itself, especially in the field.</li><li>Suspension relief straps let the worker take weight off the leg straps and buy time.</li><li>Never work alone at height.</li><li>Anybody who takes a fall gets medical evaluation even if he says he is fine.</li></ul>`}
  ],
  quiz:[
   {q:"General construction fall protection trigger height?",o:["4 feet","6 feet","10 feet","15 feet"],a:1,
    e:"6 feet under 1926.501 for general construction. Note that general industry — our own shop platforms — triggers at 4 feet."},
   {q:"Steel erection trigger height for most workers?",o:["25 feet","6 feet","10 feet","15 feet"],a:3,
    e:"15 feet under Subpart R. Connectors between 15 and 30 feet must be provided fall protection and given the option to tie off."},
   {q:"Required anchorage strength for a personal fall arrest system?",o:["500 lb","1,800 lb","5,000 lb per person, or engineered with a safety factor of two","No specific requirement"],a:2,
    e:"5,000 lb per attached person, or designed by a qualified person with a safety factor of at least two, and independent of platform support anchorages."},
   {q:"You find hot slag burns on your harness webbing. What do you do?",o:["Remove it from service permanently and destroy it","Use it only for short jobs","Use it, the webbing is still thick","Tape over the burns"],a:0,
    e:"Out of service permanently. Heat damage can cut webbing strength drastically with little visible sign. Tag it, cut it, discard it."},
   {q:"Why is a rescue plan needed before anyone works at height?",o:["It is only needed over 30 feet","Insurance paperwork","Suspension trauma can incapacitate a suspended worker within minutes","To pick the anchor point"],a:2,
    e:"Suspension trauma can cause loss of consciousness quickly. There has to be a named rescuer, equipment on site, and a time target — not just a 911 call."}
  ]},

{ id:'M09', month:'2027-04', title:'Rigging, Slings & Overhead Crane', refs:'29 CFR 1910.179 · 1910.184 · ASME B30', cycle:'Annual', scope:'all',
  sections:[
   {h:'Crane inspections', b:`<p class="lead">Overhead crane inspection under 1910.179 runs on two schedules, and one of them has to be written down.</p>
   <ul><li><b>Frequent — daily to monthly:</b> visual check of operating mechanisms, air and hydraulic lines for leaks, hooks for deformation and cracks, hoist chains and ropes, and functional operating mechanisms including brakes and limit devices.</li><li><b>Periodic — one to twelve months:</b> a deeper inspection covering deformed or cracked members, loose bolts and rivets, worn sheaves and drums, wear on pins, bearings, shafts, gears, brake system parts, and electrical apparatus.</li><li><b>Documented monthly:</b> the inspection of hooks, hoist chains, and running rope requires a <b>signed, dated, certification record</b> kept on file. That is the record an inspector asks for.</li><li>A crane out of service more than a month gets a frequent inspection before use; over six months, a full periodic inspection.</li><li>Rated capacity is legibly marked on both sides of the crane and on the load block. If you cannot read it, you do not know it.</li></ul>`},
   {h:'Sling angle is not a detail', b:`<p>The more a sling leans away from vertical, the more tension is in it — and the number climbs fast.</p>
   <ul><li><b>Angle measured from horizontal:</b><br>
   90° — load factor 1.00<br>
   60° — load factor 1.155<br>
   45° — load factor 1.414<br>
   <b>30° — load factor 2.00</b></li></ul>
   <p>At 30° from horizontal each leg carries <b>double</b> the share of the load it would carry hanging straight down. A 2,000 lb load on two legs at 30° puts 2,000 lb in each leg, not 1,000. That is how a rated sling gets overloaded on a load that looked light.</p>
   <ul><li><b>Never rig below 30° from horizontal.</b> 45° or better is the working target.</li><li>Choker hitch reduces capacity, typically to about 80% of the vertical rating.</li><li>Load is not shared evenly on more than two legs unless the rigging is adjustable — with four legs, design for two carrying it.</li></ul>`},
   {h:'Slings and hardware', b:`<ul><li><b>Every sling needs a legible tag</b> with capacity for each hitch type. No tag, no use — out of service, no exceptions.</li><li><b>Synthetic web and round slings:</b> remove for acid or caustic burns, melting or charring, holes, tears, cuts, snags, broken stitching, worn or distorted fittings, and knots. <b>Slag and sparks destroy synthetic slings — keep them out of the welding area.</b></li><li><b>Wire rope:</b> remove for 10 randomly distributed broken wires in one rope lay, or 5 in one strand; kinking, crushing, birdcaging, heat damage, corrosion, end attachment damage.</li><li><b>Alloy chain:</b> remove for cracks, gouges, stretch, twisted or bent links, wear beyond allowable.</li><li><b>Hooks:</b> remove for cracks, <b>throat opening more than 15% over new</b>, or <b>twist more than 10° from plane</b>. Latches must work.</li><li><b>Softeners or edge protection on every sharp corner.</b> A plate edge cuts a synthetic sling under load quicker than people expect.</li><li>Never shorten a sling with knots, bolts, or by wrapping it around the hook. Never repair a sling in the field.</li><li>Shackles loaded through the bow, pin properly seated. No substituting bolts for shackle pins.</li></ul>`},
   {h:'Making the lift', b:`<ul><li>Know the actual weight. Estimate high, and confirm against the drawing or the mill weight, not a guess.</li><li>Find the center of gravity. Rig above it or the load rotates when it comes off the ground.</li><li>Take the slack out and <b>trial lift a few inches</b> — verify the rigging, the balance, and the brake before committing.</li><li><b>One designated signal person</b> at a time, in a high-visibility vest, using standard hand signals. Anybody can give a stop signal.</li><li>Nobody rides the load or the hook. <b>Nobody under a suspended load, ever.</b></li><li>Use taglines to control rotation — hands off the load itself.</li><li>Do not side-pull, do not drag a load, and do not use the crane to break something loose.</li><li>Lift smooth, no jerking. Shock loading can multiply the actual force in the rigging far past the static weight.</li><li>Do not leave a load suspended. If it is unavoidable, barricade the area and keep it attended.</li><li><b>The upper limit switch is a safety device, not a stopping device.</b> Do not run the block into it as a normal practice.</li><li>Stop the lift if anything looks wrong. Nobody in this shop will second-guess a stop call.</li></ul>`},
   {h:'Fabrication-specific traps', b:`<ul><li><b>Never rig through a weld that has not been inspected</b>, and never use a tack weld as a lift point. Lift lugs are engineered, welded to spec, and inspected.</li><li>Long, limber members — trusses, joists, beams — need spreader beams and enough pick points to control deflection. A beam picked at one point can whip or fold.</li><li>Do not let the work lead current return through the crane, hoist, rope, or rigging. Welding current through a bearing or a wire rope destroys it invisibly.</li><li>Keep slings and chains out of the spark stream and off of hot steel.</li><li>Watch the pinch points when landing a load. Hands and feet get caught between the load and the stand, not between the load and the ground.</li></ul>`}
  ],
  quiz:[
   {q:"Two-leg sling at 30° from horizontal versus straight vertical — what happens to leg tension?",o:["It increases about 10%","It stays the same","It roughly doubles","It is cut in half"],a:2,
    e:"Load factor at 30° from horizontal is 2.00 — each leg carries double. This is how a rated sling gets overloaded on a load that looked light."},
   {q:"When must a hook be removed from service?",o:["Any surface rust","Throat opening more than 15% over new, or twist over 10°","Only if it is visibly bent in half","Once a year regardless"],a:1,
    e:"Cracks, throat opening more than 15% over new, or twist more than 10° from plane. Latches must also function."},
   {q:"Which crane inspection requires a signed, dated record on file?",o:["The monthly inspection of hooks, hoist chains, and running rope","Only the annual","Only after a repair","None are documented"],a:0,
    e:"The monthly hook, hoist chain, and running rope inspection requires a signed and dated certification record retained on file. That is the document an inspector requests."},
   {q:"You must leave a load hanging to reposition a stand. What is required?",o:["Have someone stand under it to steady it","Set the brake and walk away","Nothing, it is only a minute","Barricade the area and keep it attended — and avoid it if at all possible"],a:3,
    e:"Do not leave a suspended load unattended. If unavoidable, barricade the area and keep it attended. Nobody goes under a suspended load, ever."},
   {q:"What is the upper limit switch for?",o:["A safety backup, not a stopping device","Setting the lift height","Measuring the load","A routine way to stop the hoist at the top"],a:0,
    e:"It is a safety device. Using it as a routine stop wears it out and eventually it will not be there when it matters."}
  ]},

{ id:'M10', month:'2027-05', title:'Hearing Conservation & Noise', refs:'29 CFR 1910.95', cycle:'Annual', scope:'all',
  sections:[
   {h:'The two numbers', b:`<p class="lead">Noise-induced hearing loss is permanent, painless, and gradual. There is no treatment and no recovery. You do not notice it happening — you notice it years later when you cannot follow a conversation in a restaurant.</p>
   <ul><li><b>Action level: 85 dBA</b> as an 8-hour time-weighted average. At or above this, a hearing conservation program is required — monitoring, audiograms, protection made available, training.</li><li><b>Permissible exposure limit: 90 dBA</b> as an 8-hour TWA.</li><li><b>Exchange rate: 5 dB.</b> Every 5 dB increase cuts the allowable time in half — 90 dBA for 8 hours, 95 for 4, 100 for 2, 105 for 1.</li><li><b>Ceiling: 115 dBA</b> for any period, and no exposure to impulse or impact noise over 140 dB peak.</li></ul>`},
   {h:'What our shop sounds like', b:`<p>Typical sound levels for fab shop work:</p>
   <ul><li>Angle grinder on steel — 95 to 110 dBA</li><li>Needle scaler / chipping hammer — 100 to 115 dBA</li><li>Air chisel — 105 to 115 dBA</li><li>Plasma cutter — 95 to 105 dBA</li><li>Impact wrench — 100 to 110 dBA</li><li>Band saw, drill press — 85 to 95 dBA</li><li>Hammering on plate — impulse peaks well over 120 dB</li><li>Arc welding itself — often only 75 to 85 dBA, which is why people underestimate shop noise. It is the grinding and the chipping that get you.</li></ul>
   <p>Rule of thumb: if you have to raise your voice to be understood at arm's length, you are around 85 dBA and it is time for protection.</p>`},
   {h:'Choosing and wearing protection', b:`<p>The Noise Reduction Rating on the package is a laboratory number. Real-world protection is lower, and how you wear it matters far more than which one you buy.</p>
   <ul><li><b>Foam plugs</b> — highest NRR available, cheapest, and the most commonly worn wrong.</li><li><b>Earmuffs</b> — easier to get right, easier on and off, and they work over a hood. Hair, glasses temples, and hood straps break the seal.</li><li><b>Banded / reusable plugs</b> — convenient for in and out work.</li><li><b>Dual protection</b> — plugs and muffs together for the loudest work. Combined protection is roughly the higher NRR plus 5 dB, not the sum.</li></ul>
   <h3>Inserting a foam plug correctly</h3>
   <ol><li>Clean hands. Roll the plug down tight and thin between your fingers.</li><li>Reach over your head with the opposite hand and pull the ear up and out to straighten the canal.</li><li>Insert well into the canal and hold a few seconds while it expands.</li><li>Check it: cup your hands over your ears. If it gets noticeably quieter, the plugs are not in far enough.</li></ol>
   <div class="callout"><b>Half in is barely in</b>A foam plug just resting in the outer ear gives you a small fraction of its rated protection. Most people who say plugs do not work for them have never had one seated correctly.</div>`},
   {h:'Audiograms and threshold shift', b:`<ul><li>A baseline audiogram is established within 6 months of first exposure at or above the action level, after at least 14 hours away from workplace noise.</li><li>Annual audiograms follow, compared against the baseline.</li><li><b>Standard threshold shift: an average change of 10 dB or more at 2000, 3000, and 4000 Hz</b> in either ear compared to baseline.</li><li>An STS gets you notified in writing within 21 days, refitted and retrained on protection, and referred for evaluation if needed.</li><li>Getting an STS is not a disciplinary matter. It is information, and catching it early is the entire point of testing.</li><li>Records: exposure measurements kept 2 years, audiometric records kept for the duration of employment.</li></ul>`},
   {h:'Protecting hearing off the clock', b:`<p>Your ears do not know whether the noise is from work. Total dose is what matters.</p>
   <ul><li>Firearms without protection is one of the fastest ways to lose hearing — a single unprotected shot can do permanent damage.</li><li>Chainsaws, mowers, leaf blowers, motorcycles, power tools at the house.</li><li>Earbuds at high volume for hours.</li><li>Keep protection in the truck. The cheapest pair you actually wear beats the best pair in the drawer.</li></ul>`}
  ],
  quiz:[
   {q:"At what exposure level is a hearing conservation program required?",o:["90 dBA TWA","100 dBA TWA","80 dBA TWA","85 dBA 8-hour TWA"],a:3,
    e:"85 dBA as an 8-hour TWA is the action level triggering monitoring, audiograms, available protection, and training. The PEL is 90 dBA."},
   {q:"What is the permissible exposure limit?",o:["There is no limit with protection","85 dBA 8-hour TWA","90 dBA 8-hour TWA","100 dBA 8-hour TWA"],a:2,
    e:"90 dBA as an 8-hour TWA, with a 5 dB exchange rate — 95 for 4 hours, 100 for 2, 105 for 1."},
   {q:"How is a standard threshold shift defined?",o:["Any measurable hearing change","10 dB average change at 2000, 3000, and 4000 Hz from baseline","25 dB loss at any frequency","Total hearing loss in one ear"],a:1,
    e:"An average shift of 10 dB or more at 2000, 3000, and 4000 Hz in either ear versus baseline. Written notice within 21 days and refitting follow."},
   {q:"How do you properly insert a foam earplug?",o:["Roll it thin, pull the ear up and out, insert deep, hold while it expands","Wet it first","Insert halfway so you can still hear","Push it in the outer ear"],a:0,
    e:"Roll it down thin, reach over and pull the ear up and out to straighten the canal, insert well in, hold while it expands, then check the seal."},
   {q:"Noise-induced hearing loss is:",o:["Temporary, hearing comes back overnight","Permanent and untreatable","Only a problem after age 60","Fixable with hearing aids"],a:1,
    e:"Permanent, painless, and gradual, with no recovery. Hearing aids amplify but do not restore what is lost. Prevention is the only option."}
  ]},

{ id:'M11', month:'2027-06', title:'HazCom, SDS & Chemical Safety', refs:'29 CFR 1910.1200', cycle:'Annual', scope:'all',
  sections:[
   {h:'Right to understand', b:`<p class="lead">The Hazard Communication Standard says you have a right to know what chemicals you work around and to understand what they can do to you. In this shop that means welding rod and wire, shielding gas, primer, paint, thinner, solvent, degreaser, anti-spatter, cutting fluid, pickling paste, layout dye, adhesives, and fuel.</p>
   <p>The program has four parts: a written program, labels, safety data sheets, and training. All four have to be there.</p>`},
   {h:'Reading a label', b:`<p>Every shipped container carries six elements:</p>
   <ol><li><b>Product identifier</b> — matches the SDS</li><li><b>Signal word</b> — <b>DANGER</b> for the more severe hazards, <b>WARNING</b> for the less severe. Only one appears.</li><li><b>Hazard statements</b> — plain language: "Causes serious eye damage"</li><li><b>Pictograms</b> — red diamond, black symbol</li><li><b>Precautionary statements</b> — prevention, response, storage, disposal</li><li><b>Supplier information</b> — name, address, phone</li></ol>
   <h3>The pictograms</h3>
   <ul><li><b>Flame</b> — flammable, self-heating, pyrophoric</li><li><b>Flame over circle</b> — oxidizer</li><li><b>Exploding bomb</b> — explosive, organic peroxide</li><li><b>Gas cylinder</b> — gas under pressure</li><li><b>Corrosion</b> — skin and eye damage, corrosive to metal</li><li><b>Skull and crossbones</b> — acute toxicity, fatal or toxic</li><li><b>Exclamation mark</b> — irritant, narcotic effects, less severe toxicity</li><li><b>Health hazard</b> — carcinogen, mutagen, reproductive toxicity, respiratory sensitizer, organ damage</li><li><b>Environment</b> — aquatic toxicity (not required by OSHA)</li></ul>`},
   {h:'Safety data sheets', b:`<p>Sixteen sections, same order on every sheet, so you can find what you need fast. The four you will actually reach for:</p>
   <ul><li><b>Section 2 — Hazard identification.</b> What it does to you, signal word, pictograms, statements.</li><li><b>Section 4 — First-aid measures.</b> What to do right now. Read this one before you need it.</li><li><b>Section 8 — Exposure controls / personal protection.</b> Exposure limits and what PPE and ventilation are required.</li><li><b>Section 7 — Handling and storage.</b> Incompatibilities and storage conditions.</li></ul>
   <p>Also worth knowing: Section 5 firefighting, Section 6 accidental release, Section 9 physical properties including flash point, Section 10 stability and reactivity, Section 11 toxicological information.</p>
   <p>SDSs have to be <b>readily accessible during every shift</b> without asking permission and without a delay. Know where the binder is and know how to pull one up. Sections 12 through 15 are not enforced by OSHA but are on the sheet.</p>
   <div class="callout"><b>New product on the shelf</b>Nothing gets used until the label has been read and the SDS is on file. If a product shows up without a sheet, tell the foreman and leave it alone.</div>`},
   {h:'Containers in the shop', b:`<ul><li><b>Never remove or deface a label</b> on a shipped container.</li><li>A <b>secondary container</b> — the spray bottle of thinner, the coffee can of solvent — must be labeled with the product identifier and the hazard information. The only exception is a portable container filled from a labeled source and used entirely by the person who filled it within that shift.</li><li><b>Never put a chemical in a food or drink container.</b> Not once, not briefly.</li><li>Keep flammables in approved safety cans and in a flammable storage cabinet. Ground and bond when transferring.</li><li>Store acids and bases apart. Keep oxidizers away from flammables and organics.</li><li>Keep containers closed. Wipe up and dispose of rags in a closed metal container — oily rags self-heat and start fires on their own.</li></ul>`},
   {h:'Specific hazards on our floor', b:`<ul><li><b>Chlorinated solvents near an arc.</b> Brake cleaner and similar degreasers can form phosgene gas. Approved cleaners only on anything going near heat.</li><li><b>Paint, primer, thinner.</b> Flammable vapor is heavier than air and travels along the floor to an ignition source. Ventilate, no hot work in the spray area, respiratory protection for spraying.</li><li><b>Welding rod and wire.</b> Yes, they have SDSs, and Section 8 tells you what the fume requires.</li><li><b>Pickling paste and passivating acids</b> for stainless — hydrofluoric or nitric acid content, severe burns, specific first aid. Read Section 4 <i>before</i> you open it.</li><li><b>Compressed gases</b> — asphyxiation risk from shielding gas in low or enclosed spaces.</li></ul>
   <h3>If there is a spill or an exposure</h3>
   <ol><li>Get clear and get others clear. Kill ignition sources.</li><li>Eyes or skin — flush 15 minutes minimum at the eyewash or shower. Take the SDS with you if you go for treatment.</li><li>Tell the foreman. Every time, including small ones.</li><li>Only clean up a spill you are trained and equipped for. Anything larger, evacuate and call.</li></ol>`}
  ],
  quiz:[
   {q:"Which SDS section covers first-aid measures?",o:["Section 4","Section 8","Section 11","Section 2"],a:0,
    e:"Section 4. Read it before you open the container, not after somebody gets it in their eyes."},
   {q:"Which SDS section lists required PPE and exposure limits?",o:["Section 3","Section 6","Section 8","Section 14"],a:2,
    e:"Section 8, Exposure controls and personal protection."},
   {q:"You pour thinner into a spray bottle for your own use, and someone else will use it too. What is required?",o:["A piece of tape with your initials","Only the word FLAMMABLE","Nothing, it is obvious what it is","Label it with the product identifier and hazard information"],a:3,
    e:"Secondary containers need the product identifier and hazard information. The exception only covers a container filled from a labeled source and used entirely by the person who filled it within that shift."},
   {q:"Which signal word indicates the more severe hazard?",o:["Warning","Danger","Notice","Caution"],a:1,
    e:"DANGER for more severe hazards, WARNING for less severe. Only one appears on a label."},
   {q:"A new solvent arrives with no safety data sheet on file. What do you do?",o:["Use it only with gloves","Pour it into a labeled can","Use it, the label is enough","Do not use it — tell the foreman and get the SDS on file"],a:3,
    e:"Nothing gets used until the label is read and the SDS is on file and accessible. SDSs must be readily available during every shift."}
  ]},

{ id:'M12', month:'2027-07', title:'Electrical Safety for Welders + Incident Review', refs:'29 CFR 1910.254 · 1910.333 · 1910.304', cycle:'Annual', scope:'all',
  sections:[
   {h:'The voltage you ignore', b:`<p class="lead">Welders get comfortable around electricity, and that comfort is the hazard. Open circuit voltage on a stick machine typically runs 20 to 100 volts. It does not take much: current across the chest in the range of 50 milliamps can stop a heart, and 120 V shop circuits kill more people every year than welding machines do.</p>
   <ul><li>What matters is current through the body, and that depends on your resistance.</li><li><b>Dry skin, dry clothes, dry gloves: high resistance.</b> Sweat, rain, standing water, damp leathers: resistance drops sharply and a voltage that felt like a tingle becomes dangerous.</li><li>Working in a tank, on grating, or against structural steel means you are in contact with ground over a large area — the worst case for a shock path.</li><li>A shock does not have to be fatal to kill you. A jolt at height, on a ladder, or over a running machine kills through the fall.</li></ul>`},
